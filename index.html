<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS, Client/Server & CPU Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#11161c;
    --panel:#1a232c;
    --panel-2:#212c37;
    --panel-3:#26313d;
    --line: rgba(237,237,230,0.10);
    --text:#edede6;
    --muted:#93a1ad;
    --amber:#e8a33d;
    --amber-dim: rgba(232,163,61,0.16);
    --teal:#57d0bd;
    --teal-dim: rgba(87,208,189,0.16);
    --violet:#b78ce8;
    --violet-dim: rgba(183,140,232,0.16);
    --good:#4fbf78;
    --good-dim: rgba(79,191,120,0.16);
    --bad:#e5654f;
    --bad-dim: rgba(229,101,79,0.14);
    --radius: 10px;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#11161c; --panel:#1a232c; --panel-2:#212c37; --panel-3:#26313d; --text:#edede6; --muted:#93a1ad;
    }
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(87,208,189,0.07), transparent 60%),
      radial-gradient(900px 600px at -10% 10%, rgba(232,163,61,0.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;}
  .serif{font-family:"IBM Plex Serif", Georgia, serif;}

  .wrap{max-width:880px; margin:0 auto; padding:28px 20px 64px;}

  /* ---- Top bar / brand ---- */
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px; cursor:pointer; width:max-content;}
  .brand .chip{
    width:30px; height:30px; border-radius:7px;
    background: linear-gradient(155deg, var(--amber), #b97a1f);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono"; font-weight:700; font-size:13px; color:#1a1206;
    flex:none;
  }
  .brand .name{font-size:15px; letter-spacing:0.02em; color:var(--muted);}
  .brand .name b{color:var(--text); font-weight:600;}

  /* ---- HERO / HOME ---- */
  .hero h1{
    font-family:"IBM Plex Serif"; font-weight:600; font-style:italic;
    font-size: clamp(30px, 6vw, 46px); line-height:1.08; margin:0 0 14px;
    max-width: 14ch;
  }
  .hero p.lead{color:var(--muted); font-size:16px; line-height:1.6; max-width:56ch; margin:0 0 28px;}

  .statrow{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:34px;}
  .stat{padding:14px 0; border-top:1px solid var(--line); min-width:120px;}
  .stat .n{font-family:"IBM Plex Mono"; font-size:26px; font-weight:600; color:var(--teal);}
  .stat .l{font-size:12.5px; color:var(--muted); margin-top:3px;}

  .modecards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px;}
  @media (max-width:600px){.modecards{grid-template-columns:1fr;}}
  .modecard{
    text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px; cursor:pointer; color:var(--text); font:inherit;
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
    position:relative; overflow:hidden;
  }
  .modecard:hover{border-color:rgba(237,237,230,0.22); background:var(--panel-2);}
  .modecard:active{transform:scale(0.99);}
  .modecard .tag{font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:0.04em; color:var(--amber); margin-bottom:10px; display:block;}
  .modecard.teal .tag{color:var(--teal);}
  .modecard h3{margin:0 0 8px; font-size:19px; font-weight:600;}
  .modecard p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.5;}
  .modecard .led{
    position:absolute; top:20px; right:20px; width:9px; height:9px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px 1px var(--amber);
  }
  .modecard.teal .led{background:var(--teal); box-shadow:0 0 10px 1px var(--teal);}

  .coverage{border-top:1px solid var(--line); padding-top:20px;}
  .coverage h4{font-size:12.5px; text-transform:none; letter-spacing:0.01em; color:var(--muted); margin:0 0 10px; font-weight:500;}
  .coverage ul{margin:0; padding-left:18px; color:var(--text); font-size:14px; line-height:1.9; columns:2; column-gap:26px;}
  @media (max-width:560px){.coverage ul{columns:1;}}
  .coverage li::marker{color:var(--muted);}

  /* ---- shared top controls for study/quiz views ---- */
  .viewhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .back{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .back:hover{color:var(--text); border-color:rgba(237,237,230,0.25);}

  .filterrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .fbtn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 14px; font:inherit; font-size:12.5px; cursor:pointer;
    font-family:"IBM Plex Mono";
  }
  .fbtn.active{background:var(--amber-dim); border-color:rgba(232,163,61,0.5); color:var(--amber);}
  .fbtn.active.teal{background:var(--teal-dim); border-color:rgba(87,208,189,0.5); color:var(--teal);}
  .fbtn.active.violet{background:var(--violet-dim); border-color:rgba(183,140,232,0.5); color:var(--violet);}

  /* group chips */
  .groupgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px;}
  @media (max-width:600px){.groupgrid{grid-template-columns:1fr;}}
  .groupchip{
    text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:12px 14px; font:inherit; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .groupchip:hover{border-color:rgba(237,237,230,0.25); background:var(--panel-2);}
  .groupchip .gt{font-size:14px; font-weight:500;}
  .groupchip .gc{font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); flex:none;}
  .groupchip.active{border-color:rgba(232,163,61,0.55); background:var(--amber-dim);}
  .groupchip.active.teal{border-color:rgba(87,208,189,0.55); background:var(--teal-dim);}
  .groupchip.active.violet{border-color:rgba(183,140,232,0.55); background:var(--violet-dim);}

  .sectionlabel{font-family:"IBM Plex Mono"; font-size:11.5px; letter-spacing:0.03em; color:var(--muted); margin:22px 0 10px;}
  .sectionlabel:first-child{margin-top:0;}

  /* segmented control */
  .segwrap{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px;}
  .seg{
    background:none; border:none; color:var(--muted); font:inherit; font-size:13px;
    padding:8px 14px; border-radius:7px; cursor:pointer; font-family:"IBM Plex Mono";
  }
  .seg.active{background:var(--panel-3); color:var(--text);}
  .segrow{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .seglabel{font-size:12.5px; color:var(--muted); margin-bottom:2px;}

  .progwrap{margin-bottom:22px;}
  .progtext{display:flex; justify-content:space-between; font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); margin-bottom:7px;}
  .progtext b{color:var(--text); font-weight:600;}
  .progbar{height:5px; border-radius:4px; background:rgba(237,237,230,0.08); overflow:hidden;}
  .progfill{height:100%; background:linear-gradient(90deg, var(--amber), var(--teal)); width:0%; transition:width .25s ease;}

  /* ---- FLASHCARDS ---- */
  .cardstage{perspective:1600px; margin-bottom:22px;}
  .flashcard{
    position:relative; width:100%; min-height:300px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    border:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; justify-content:center; padding:38px 34px;
  }
  .face.back{transform:rotateY(180deg); background:var(--panel-2);}
  .face .modlabel{font-family:"IBM Plex Mono"; font-size:11px; color:var(--amber); letter-spacing:0.04em; margin-bottom:16px;}
  .face.teal .modlabel{color:var(--teal);}
  .face.violet .modlabel{color:var(--violet);}
  .face .termtext{font-family:"IBM Plex Serif"; font-weight:600; font-size: clamp(22px,4vw,30px); line-height:1.25;}
  .face .deftext{font-size:16.5px; line-height:1.6; color:var(--text);}
  .face .hint{position:absolute; bottom:16px; right:20px; font-family:"IBM Plex Mono"; font-size:11px; color:var(--muted);}

  .cardnav{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .navbtns{display:flex; gap:8px;}
  .navbtn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 16px; font:inherit; font-size:14px; cursor:pointer;
  }
  .navbtn:hover{border-color:rgba(237,237,230,0.28);}
  .navbtn.primary{background:var(--teal-dim); border-color:rgba(87,208,189,0.45); color:var(--teal); font-weight:600;}
  .navbtn:disabled{opacity:0.35; cursor:default;}
  .iconbtn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    width:38px; height:38px; font:inherit; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{color:var(--text);}
  .iconbtn.active{color:var(--amber); border-color:rgba(232,163,61,0.5);}

  /* flashcard LIST mode (grouped, nothing skipped) */
  .listcard{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; overflow:hidden;
  }
  .listhead{
    width:100%; text-align:left; background:none; border:none; color:var(--text); font:inherit;
    padding:14px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .listhead .lt{font-weight:600; font-size:14.5px;}
  .listhead .lx{font-family:"IBM Plex Mono"; color:var(--muted); font-size:14px; flex:none; transition:transform .15s;}
  .listcard.open .listhead .lx{transform:rotate(45deg); color:var(--amber);}
  .listbody{
    max-height:0; overflow:hidden; transition:max-height .2s ease;
    color:var(--muted); font-size:14px; line-height:1.6; padding:0 16px;
  }
  .listcard.open .listbody{max-height:400px; padding:0 16px 16px;}
  .listtoolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}

  /* ---- QUIZ ---- */
  .scorepill{
    font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }
  .scorepill b{color:var(--good);}
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:30px 28px; margin-bottom:18px;
  }
  .qmod{font-family:"IBM Plex Mono"; font-size:11px; color:var(--amber); margin-bottom:14px; letter-spacing:0.04em;}
  .qmod.teal{color:var(--teal);}
  .qmod.violet{color:var(--violet);}
  .qtext{font-family:"IBM Plex Serif"; font-size: clamp(19px,3.2vw,23px); font-weight:600; line-height:1.4; margin-bottom:24px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:14px 16px; font:inherit; font-size:15px; cursor:pointer;
    display:flex; align-items:center; gap:12px; transition:border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled){border-color:rgba(237,237,230,0.3);}
  .opt:disabled{cursor:default;}
  .opt .letter{
    font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); width:22px; height:22px; border-radius:6px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .opt.correct{background:var(--good-dim); border-color:rgba(79,191,120,0.55);}
  .opt.correct .letter{color:var(--good); border-color:rgba(79,191,120,0.55);}
  .opt.wrong{background:var(--bad-dim); border-color:rgba(229,101,79,0.55);}
  .opt.wrong .letter{color:var(--bad); border-color:rgba(229,101,79,0.55);}
  .opt.dim{opacity:0.45;}

  /* identification (typed recall) */
  .idform{display:flex; gap:10px; flex-wrap:wrap;}
  .idinput{
    flex:1 1 220px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:14px 16px; font:inherit; font-size:15px;
  }
  .idinput:focus{outline:none; border-color:rgba(232,163,61,0.55);}
  .idinput:disabled{opacity:0.7;}
  .idsubmit{
    background:var(--amber-dim); border:1px solid rgba(232,163,61,0.5); color:var(--amber);
    border-radius:10px; padding:14px 20px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; flex:none;
  }
  .idsubmit:hover{border-color:rgba(232,163,61,0.8);}
  .idsubmit:disabled{opacity:0.4; cursor:default;}
  .idresult{margin-top:18px; padding:16px 18px; border-radius:10px; display:none;}
  .idresult.show{display:block;}
  .idresult.good{background:var(--good-dim); border:1px solid rgba(79,191,120,0.4);}
  .idresult.bad{background:var(--bad-dim); border:1px solid rgba(229,101,79,0.4);}
  .idrow{display:flex; justify-content:space-between; gap:14px; font-size:14px; padding:4px 0; flex-wrap:wrap;}
  .idrow .k{color:var(--muted); flex:none;}
  .idrow .v{font-weight:600; text-align:right;}
  .idresult.good .v{color:#bdeccf;}
  .idresult.bad .v.correct-term{color:#bdeccf;}
  .idresult.bad .v.your-term{color:#f6c9c1;}
  .overridebtn{
    margin-top:12px; background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:8px 14px; font:inherit; font-size:12.5px; cursor:pointer;
  }
  .overridebtn:hover{color:var(--text); border-color:rgba(237,237,230,0.3);}
  .overridebtn.flipped{color:var(--good); border-color:rgba(79,191,120,0.4);}

  .feedback{
    margin-top:18px; padding:14px 16px; border-radius:10px; font-size:14.5px; line-height:1.55;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-dim); border:1px solid rgba(79,191,120,0.4); color:#bdeccf;}
  .feedback.bad{background:var(--bad-dim); border:1px solid rgba(229,101,79,0.4); color:#f6c9c1;}
  .feedback b{color:var(--text);}

  .quizfoot{display:flex; justify-content:flex-end; margin-top:6px;}

  /* results */
  .results{text-align:center; padding:30px 10px;}
  .results .big{font-family:"IBM Plex Mono"; font-size:52px; font-weight:700; color:var(--teal); margin-bottom:6px;}
  .results p{color:var(--muted); margin:0 0 26px;}

  .startbtn{
    background:linear-gradient(155deg, var(--amber), #b97a1f); border:none; color:#1a1206;
    border-radius:10px; padding:15px 22px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    width:100%;
  }
  .startbtn:hover{filter:brightness(1.07);}

  footer.note{color:var(--muted); font-size:12.5px; text-align:center; margin-top:40px; line-height:1.6;}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    .flashcard{transition:none;} .progfill{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */
</script>
<script>
const FLASHCARDS = [
// ---- OS CORE CONCEPTS ----
{t:"Operating system (OS)",d:"A computer program that provides a user interface, storage management (file system), process/service management, memory & I/O management, security & resource protection, and a kernel.",m:1,g:"m1-core"},
{t:"User interface",d:"The OS feature that lets users interact with the computer, typically via keyboard/mouse or touch.",m:1,g:"m1-core"},
{t:"File system",d:"The method by which an OS stores and organizes files and manages access to them on a storage device.",m:1,g:"m1-core"},
{t:"Process",d:"A program that has been loaded into memory and is run by the CPU.",m:1,g:"m1-core"},
{t:"Service",d:"The Windows term for a process without a user interface that runs in the background.",m:1,g:"m1-core"},
{t:"Daemon",d:"The Linux term for a process without a user interface that runs in the background (same idea as a Windows \"service\").",m:1,g:"m1-core"},
{t:"Kernel",d:"The heart of the OS. It runs with the highest priority and handles scheduling, memory/I/O management, and security.",m:1,g:"m1-core"},

// ---- SINGLE- VS. MULTITASKING ----
{t:"Single-tasking operating system",d:"An OS that can execute only a single process at a time (e.g., CP/M, MS-DOS, Palm OS, iOS 3 and earlier).",m:1,g:"m1-tasking"},
{t:"Multitasking operating system",d:"An OS that quickly switches between all processes loaded into memory so multiple programs appear to run at once.",m:1,g:"m1-tasking"},
{t:"iOS 3 (and earlier)",d:"A single-tasking OS for iPhone/iPad — only the foreground app received CPU time.",m:1,g:"m1-tasking"},
{t:"iOS 4 / iOS 4.2",d:"iOS 4 (June 2010) brought multitasking to iPhone; iOS 4.2 (Nov 2010) allowed multitasking on iPad.",m:1,g:"m1-tasking"},
{t:"CP/M, PC-DOS, MS-DOS",d:"Command-line, single-tasking OSs; the original operating systems on the IBM PC in the early 1980s. CP/M stands for Control Program for Microcomputers.",m:1,g:"m1-tasking"},
{t:"Personal digital assistant (PDA)",d:"A handheld device running email, calendar, note-taking, and web apps, but without an integrated phone (e.g., ran Palm OS).",m:1,g:"m1-tasking"},
{t:"Embedded system",d:"A computing device designed for one specific task (e.g., a dishwasher controller or car braking system), often single-tasking.",m:1,g:"m1-tasking"},
{t:"Cooperative multitasking",d:"The OS gives CPU control to a process and waits for it to terminate or enter a waiting state before giving control to the next process. Used by Windows until Windows 95.",m:1,g:"m1-tasking"},
{t:"Preemptive multitasking",d:"The OS strictly controls CPU time, giving each process a time slice based on interrupts, priority, or the timer expiring. Used by modern server/desktop/laptop OSs.",m:1,g:"m1-tasking"},

// ---- SINGLE-USER, MULTIUSER & REAL-TIME OSS ----
{t:"Single-user operating system",d:"Allows only one user at a time to interact with the OS UI, start processes, and access the file system directly (e.g., Windows 10, iOS, Android).",m:1,g:"m1-users"},
{t:"Remote Desktop Protocol (RDP)",d:"A protocol allowing a user to remotely sign in to a Windows 10 system — but only if no user is signed in at the local console.",m:1,g:"m1-users"},
{t:"Multiuser operating system",d:"Allows multiple users to sign in, start/stop processes, use the UI, and access the local file system simultaneously (e.g., Linux/UNIX, Windows Server via RDP).",m:1,g:"m1-users"},
{t:"General-purpose operating system",d:"Designed to provide a convenient UI and run business, productivity, or entertainment apps with reasonable (not guaranteed) performance.",m:1,g:"m1-users"},
{t:"Real-time operating system (RTOS)",d:"Designed to process inputs and produce outputs in a very specific, repeatable amount of time (e.g., VxWorks, QNX, LynxOS, Windows 10 IoT).",m:1,g:"m1-users"},
{t:"Deterministic",d:"Describes components of a real-time system (like network/storage) for which worst-case response times can be determined under given conditions.",m:1,g:"m1-users"},

// ---- OS ROLES: CLIENT, SERVER & STANDALONE ----
{t:"The three OS roles",d:"Client, Server, and Standalone.",m:1,g:"m1-roles"},
{t:"Client operating system",d:"An OS whose primary purpose is to run applications requested by a user and request data from network servers (e.g., Windows 10, macOS, Ubuntu Desktop).",m:1,g:"m1-roles"},
{t:"Server operating system",d:"An OS whose primary purpose is to share network resources (storage, printers) and provide network services to clients (e.g., Windows Server, UNIX, many Linux distros).",m:1,g:"m1-roles"},
{t:"Windows Server Core",d:"The default installation of Windows Server — it has no GUI, requiring administrators to use the command-line interface.",m:1,g:"m1-roles"},
{t:"Standalone operating system",d:"An OS not designed to interact with other OSs or access network resources — most common today in embedded systems.",m:1,g:"m1-roles"},

// ---- FAULT TOLERANCE & SCALABILITY ----
{t:"Fault tolerance",d:"The ability of a system to recover from a hardware or software failure.",m:1,g:"m1-fault"},
{t:"Clustering",d:"The ability of two or more servers to act as one, for fault tolerance, load sharing, or both.",m:1,g:"m1-fault"},
{t:"Failover cluster",d:"A server cluster for fault tolerance: two or more servers share identical configurations and data access; if one fails, another takes over.",m:1,g:"m1-fault"},
{t:"Load-sharing (load-balancing) cluster",d:"Two or more servers alternate taking client requests to provide faster response times.",m:1,g:"m1-fault"},
{t:"Hot swapping",d:"Replacing a failed hardware component (disk, memory, processor) without shutting the system down.",m:1,g:"m1-fault"},
{t:"Hot adding",d:"Adding new components (storage, RAM, processors) to a running system, supporting scalability.",m:1,g:"m1-fault"},

// ---- BOOT PROCESS & FIRMWARE ----
{t:"Boot procedure — 6 steps",d:"1) Power applied 2) CPU starts 3) CPU executes firmware startup routines 4) OS is located by firmware 5) OS loaded into RAM 6) OS processes/services are started.",m:1,g:"m1-boot"},
{t:"Firmware",d:"Program code stored in non-volatile memory on hardware; performs diagnostic tests and boots the OS.",m:1,g:"m1-boot"},
{t:"Non-volatile memory",d:"Memory that keeps its contents even when no power is applied (e.g., flash memory, EEPROM).",m:1,g:"m1-boot"},
{t:"Bootstrap",d:"The initial program contained in firmware that locates and loads the bootloader program.",m:1,g:"m1-boot"},
{t:"Bootloader",d:"The program (loaded by the bootstrap) responsible for loading the initial process that makes up the operating system.",m:1,g:"m1-boot"},
{t:"BOOTMGR (Windows Boot Manager)",d:"The Windows bootloader used from Windows Vista onward (NTLDR was used in older Windows).",m:1,g:"m1-boot"},
{t:"GRUB / LILO",d:"GRUB (GRand Unified Bootloader) and LILO (LInux LOader) — common bootloaders used by Linux systems.",m:1,g:"m1-boot"},
{t:"BIOS (basic input/output system)",d:"Firmware residing on a motherboard chip that initializes I/O devices, runs POST, and locates/loads the OS.",m:1,g:"m1-boot"},
{t:"UEFI",d:"Unified Extensible Firmware Interface — the newer form of firmware used on modern PCs in place of legacy BIOS.",m:1,g:"m1-boot"},
{t:"Power-on self-test (POST)",d:"Tests performed by the BIOS at startup, such as memory and hardware component tests.",m:1,g:"m1-boot"},
{t:"CMOS chip",d:"A low-power memory chip (CMOS: Complementary Metal-Oxide-Semiconductor), powered by a small battery, that stores the BIOS configuration.",m:1,g:"m1-boot"},

// ---- CPU MODES & PROCESS BASICS ----
{t:"Kernel mode (privileged mode)",d:"A CPU mode in which a process has unrestricted access to hardware and can execute privileged CPU instructions.",m:1,g:"m1-cpumode"},
{t:"User mode",d:"A CPU mode in which a process can only access memory allocated to it, must ask the OS for I/O access, and cannot run privileged instructions.",m:1,g:"m1-cpumode"},
{t:"Process ID (PID)",d:"A unique identifier assigned to a process when created, used to communicate with or manage it.",m:1,g:"m1-cpumode"},
{t:"ps (Linux command)",d:"Lists the processes you've started in Linux, including their PIDs.",m:1,g:"m1-cpumode"},
{t:"kill PID (Linux command)",d:"Terminates a process by its process ID.",m:1,g:"m1-cpumode"},
{t:"Four ways a process is created",d:"1) By the bootloader 2) Through a request by the OS 3) By another process (parent/child) 4) By a user.",m:1,g:"m1-cpumode"},
{t:"Parent process / child process",d:"When a process creates another process, the creator is the parent and the new process is the child.",m:1,g:"m1-cpumode"},

// ---- STARTUP SEQUENCE: WINDOWS & LINUX ----
{t:"systemd (or init)",d:"On Linux, the first user mode process started at boot; responsible for starting most other user mode processes.",m:1,g:"m1-startup"},
{t:"Windows Session Manager loads...",d:"...wininit and winlogon after kernel mode processes and device drivers are loaded.",m:1,g:"m1-startup"},
{t:"wininit",d:"Starts most of the services configured to start when Windows boots.",m:1,g:"m1-startup"},
{t:"winlogon",d:"Handles the Windows user logon procedure, calls lsass to verify credentials, and starts the Desktop Window Manager (dwm).",m:1,g:"m1-startup"},
{t:"lsass",d:"The authentication service used on Windows to verify user credentials.",m:1,g:"m1-startup"},
{t:"Desktop Window Manager (dwm)",d:"The process that manages much of the Windows 10 user interface.",m:1,g:"m1-startup"},
{t:"Device driver",d:"Usually a kernel mode process that accesses hardware devices directly on behalf of user mode or other kernel mode processes.",m:1,g:"m1-startup"},
{t:"File handle",d:"An identifier for a file containing all the information the file system needs to locate and access that file.",m:1,g:"m1-startup"},

// ---- I/O HANDLING & INTERRUPTS ----
{t:"Polling",d:"An I/O handling method where the OS checks each device one after another, round-robin, to see if it needs attention — generally inefficient.",m:1,g:"m1-io"},
{t:"Interrupt",d:"A signal, usually generated by an I/O device, that alerts the CPU/OS that a device needs attention.",m:1,g:"m1-io"},
{t:"Interrupt request (IRQ) line",d:"A pin on the CPU that changes state when a hardware interrupt signal is generated.",m:1,g:"m1-io"},
{t:"Interrupt service routine (ISR)",d:"Also called an interrupt handler; the code executed when an interrupt occurs — calls the relevant device driver.",m:1,g:"m1-io"},
{t:"Interrupt masking",d:"ISRs turn off interrupts of equal or lower priority while they run, to prevent unnecessary interruptions.",m:1,g:"m1-io"},
{t:"Non-maskable interrupt (NMI)",d:"A class of interrupt that cannot be turned off; reserved for error conditions like divide-by-zero or memory errors.",m:1,g:"m1-io"},
{t:"Trap",d:"A software interrupt, generated by user mode programs when they need immediate kernel services.",m:1,g:"m1-io"},

// ---- SECURITY & KERNEL IDENTITY ----
{t:"Authentication",d:"Verifies that an account trying to access a system is valid and has provided valid credentials.",m:1,g:"m1-security"},
{t:"Authorization",d:"Verifies that an authenticated account has permission to perform a specific action, like opening a file.",m:1,g:"m1-security"},
{t:"ntoskrnl.exe",d:"The name of the kernel file in Windows systems.",m:1,g:"m1-security"},
{t:"XNU (X is Not Unix)",d:"The name of the kernel used in macOS.",m:1,g:"m1-security"},
{t:"uname -sr",d:"The Linux command used to determine kernel information (name and release).",m:1,g:"m1-security"},

// ---- OS HISTORY & FLAVORS ----
{t:"Multics",d:"Widely considered to be the first multiuser, multitasking operating system; ran on PDP series computers and led to UNIX.",m:1,g:"m1-history"},
{t:"UNIX (original)",d:"Developed at AT&T Bell Labs in 1969 by Kenneth Thompson and Dennis Ritchie as an improvement on Multics.",m:1,g:"m1-history"},
{t:"BASIC",d:"Beginner's All-purpose Symbolic Instruction Code — a simple programming language developed at Dartmouth College aimed at nonprogrammers.",m:1,g:"m1-history"},
{t:"MS-DOS",d:"Microsoft Disk Operating System — evolved in 1980 from 86-DOS (originally QDOS), a command-line OS that became a runaway success for Microsoft.",m:1,g:"m1-history"},
{t:"QDOS",d:"The Quick and Dirty Operating System written by Tim Paterson for the 8086 processor; evolved into 86-DOS and then MS-DOS.",m:1,g:"m1-history"},
{t:"Apple Macintosh (1984)",d:"The first widely distributed OS that was totally graphical in its user interface; also introduced use of the mouse to PC-based systems.",m:1,g:"m1-history"},
{t:"Windows 3.0 (1990)",d:"The first usable version of a graphical operating system for the PC.",m:1,g:"m1-history"},
{t:"Windows NT (1993)",d:"Microsoft's first true 32-bit, preemptive multitasking OS with integrated networking; later offered in Workstation and Server versions.",m:1,g:"m1-history"},
{t:"Windows 95",d:"Mostly 32-bit upgrade to Windows 3.x with improved UI and native 32-bit app support; it was still backward compatible with 16-bit apps.",m:1,g:"m1-history"},
{t:"Linux kernel 0.01 (1991)",d:"Linus Torvalds made the very first version of Linux available for download via FTP.",m:1,g:"m1-history"},
{t:"OS/2 (1987)",d:"IBM operating system jointly developed with Microsoft; required extensive hardware and could not run older MS-DOS applications, so it was not a big hit.",m:1,g:"m1-history"},
{t:"Windows Server 2016",d:"Emphasizes virtualization, flexible storage, and cloud computing; introduced Nano Server and Microsoft's first support for containers.",m:1,g:"m1-history"},
{t:"GNOME 1.0 desktop (1999)",d:"Became available as free software and grew to become one of the most popular UNIX/Linux desktops.",m:1,g:"m1-history"},
{t:"SVR4 vs. BSD",d:"The two main design standards for the many \"flavors\" of UNIX: System V Release 4 and the Berkeley Software Distribution.",m:1,g:"m1-history"},
{t:"SAMBA",d:"The Linux equivalent of \"Client for Microsoft Networks,\" used for accessing shared Windows files/printers.",m:1,g:"m1-history"},
{t:"Network File System (NFS)",d:"Linux's native file sharing protocol.",m:1,g:"m1-history"},

// ---- INTERFACES & TERMINOLOGY ----
{t:"Client vs. server performance tuning",d:"Client OSs are tuned for foreground \"Programs\"; server OSs (like Windows Server) are tuned for \"Background services.\"",m:1,g:"m1-interfaces"},
{t:"Command-line interface",d:"An interface where users type commands instead of using a GUI's point-and-click method (e.g., original MS-DOS, PowerShell, a Linux shell).",m:1,g:"m1-interfaces"},
{t:"Graphical user interface (GUI)",d:"An interface allowing users to interact by pointing, clicking, or touching icons/menus rather than typing commands. First widely popularized by the 1984 Macintosh.",m:1,g:"m1-interfaces"},
{t:"Computer hardware",d:"The physical components of a computer (CPU, memory, disk, video card, etc.) that are controlled and coordinated by the operating system.",m:1,g:"m1-interfaces"},
{t:"Scalability",d:"A system's ability to grow — for example, supporting hot adding of storage, RAM, or processors while running.",m:1,g:"m1-interfaces"},
{t:"\"Job\" (legacy term)",d:"The old name for a process, dating back to when systems were single-tasking and ran programs one after another (batch processing).",m:1,g:"m1-interfaces"},
{t:"\"Task\" (as in Task Manager)",d:"Another term for a process — Windows' Task Manager is literally a process manager.",m:1,g:"m1-interfaces"},
{t:"Windows Virtual Desktop",d:"A Microsoft Azure feature that provides a true multiuser version of Windows 10 (outside of this, Windows 10 is single-user).",m:1,g:"m1-interfaces"},
{t:"Novell NetWare",d:"An older network server OS that early standalone PCs (like MS-DOS machines) were sometimes upgraded with a network card to connect to.",m:1,g:"m1-interfaces"},

// ---- SUPPORT LIFECYCLES ----
{t:"Windows 7 end of life",d:"January 2020 — Microsoft discontinued support (including security updates) for Windows 7.",m:1,g:"m1-lifecycle"},
{t:"Windows Server 2008 / 2012 support",d:"Support for Windows Server 2008 ended in January 2020; support for Windows Server 2012 was scheduled to end in October 2023.",m:1,g:"m1-lifecycle"},
{t:"Windows 10 version 1903",d:"The Windows 10 build (released March 2019) that the module's feature descriptions and screenshots are based on.",m:1,g:"m1-lifecycle"},

// ---- WINDOWS MANAGEMENT TOOLS ----
{t:"Process Explorer",d:"A free Sysinternals utility (downloadable from Microsoft) that shows a graphical process tree on Windows systems.",m:1,g:"m1-tools"},
{t:"Task Manager",d:"A Windows GUI tool for viewing and managing running processes, performance data, and startup programs.",m:1,g:"m1-tools"},
{t:"Resource Monitor",d:"A Windows tool (opened from Task Manager) showing detailed CPU, memory, disk, and network usage per process.",m:1,g:"m1-tools"},
{t:"Active Directory",d:"Microsoft's directory service, an example of a service commonly bundled with a server OS.",m:1,g:"m1-tools"},
{t:"DHCP client / DNS client",d:"Networking components preinstalled on client OSs: DHCP (Dynamic Host Configuration Protocol) automatically gets an IP address, and DNS (Domain Name System) resolves names.",m:1,g:"m1-tools"},

// ---- EARLY MS-DOS VERSIONS ----
{t:"MS-DOS 1.0 (1981)",d:"Microsoft's original OS for the IBM PC platform; often just called DOS. Supported only 5.25-inch floppy disks storing 320K.",m:2,g:"m2-dos"},
{t:"PC DOS",d:"The version of MS-DOS that ran on early IBM computers, customized and marketed by IBM (vs. Microsoft-branded MS-DOS used on PC clones).",m:2,g:"m2-dos"},
{t:"MS-DOS 2.0 (1983)",d:"Supported a 10 MB hard disk on the IBM PC-XT and 360K floppies; required a minimum of 28K RAM (up from 14K in MS-DOS 1.0).",m:2,g:"m2-dos"},
{t:"MS-DOS 3.1 (1984)",d:"First DOS version to support the network redirector, letting a shared folder be accessed as a drive letter. Also introduced Microsoft Network (MS-Net), which gained little traction against Novell NetWare.",m:2,g:"m2-dos"},
{t:"Network redirector",d:"A feature (introduced in MS-DOS 3.1) that allows a network resource, like a shared folder, to be accessed as a drive letter.",m:2,g:"m2-dos"},
{t:"MS-DOS 6.22",d:"The last version of MS-DOS released as a separate product; later versions were embedded as the underlying OS for Windows 95, 98, and ME.",m:2,g:"m2-dos"},

// ---- EARLY WINDOWS GUI ----
{t:"Windows (1983/1985)",d:"Announced in 1983, released in 1985. Early Windows was really just a graphical application with mouse support running on top of MS-DOS — not multitasking.",m:2,g:"m2-earlygui"},
{t:"Windows 3.1 (1992)",d:"The first popular, usable Microsoft GUI; still built on MS-DOS and did not support real multitasking, only task-switching.",m:2,g:"m2-earlygui"},
{t:"Task-switching",d:"A process where the system gives control to whichever window/program was just clicked, but only that foreground task gets CPU time — used in Windows 3.1 (not true multitasking).",m:2,g:"m2-earlygui"},
{t:"Windows for Workgroups (WfW) 3.1/3.11 (1993)",d:"Added built-in networking, enhanced network drivers, and a TCP/IP protocol stack. WfW 3.11 ran only in 80386 enhanced mode, making it faster/more reliable.",m:2,g:"m2-earlygui"},

// ---- WINDOWS 95 & 98 ERA ----
{t:"Windows 95",d:"Introduced the Start Menu/taskbar desktop that became the standard look for all future Windows; a hybrid 16-bit/32-bit OS that eliminated the 640 KB memory limit.",m:2,g:"m2-win95"},
{t:"Windows 95's new features",d:"The Windows desktop, Plug and Play, ActiveX/COM, the registry, multitasking & multithreading, and enhanced network/Internet capabilities.",m:2,g:"m2-win95"},
{t:"Plug and Play (PnP)",d:"A Windows 95 hardware feature that lets the OS automatically detect and configure newly installed hardware, replacing manual switch/jumper configuration.",m:2,g:"m2-win95"},
{t:"ActiveX / Component Object Model (COM)",d:"A Microsoft technology (and its parent standard) providing a standardized way for objects — programs, files, printers, windows — to communicate with each other.",m:2,g:"m2-win95"},
{t:"The registry (Windows 95+)",d:"A hierarchical database storing OS configuration, driver info, software/hardware settings, performance info, and desktop configuration — replacing scattered config files.",m:2,g:"m2-win95"},
{t:"Task supervisor",d:"A Windows 95 feature that detects processes that appear stuck (hung tasks) and lets you close them without restarting the whole OS.",m:2,g:"m2-win95"},
{t:"Hung task",d:"A process/task that no longer responds to keyboard or mouse input.",m:2,g:"m2-win95"},
{t:"Multithreading (Windows 95)",d:"Windows 95 was the first Microsoft OS to support multithreading — a CPU executing separate parts of a process at the same time.",m:2,g:"m2-win95"},
{t:"Windows 98 — Active Desktop",d:"A Windows 98 feature letting you view desktop items as a Web page; discontinued starting with Windows XP Professional 64-bit Edition.",m:2,g:"m2-win95"},
{t:"Windows 98 — USB support",d:"Windows 98 added support for newer hardware standards including Universal Serial Bus (USB) 1.0.",m:2,g:"m2-win95"},
{t:"Windows Millennium Edition (Me)",d:"Developed for home users (not office/professional); introduced Universal Plug and Play (UPnP), a set of protocols for auto-discovering/configuring network devices.",m:2,g:"m2-win95"},

// ---- WINDOWS NT FUNDAMENTALS ----
{t:"Windows NT",d:"\"Windows New Technology,\" first announced 1991 for high-end workstations/servers after Microsoft and IBM ended their OS/2 collaboration. Kernel runs in privileged mode.",m:2,g:"m2-nt"},
{t:"ntoskrnl.exe (ntoskernel)",d:"The core kernel file for Windows NT and all Windows OSs starting with Windows 2000. The kernel for Windows 9x/ME was krnl386.exe instead.",m:2,g:"m2-nt"},
{t:"Windows NT 3.1",d:"There were no earlier NT versions — NT started life as version 3.1 (announced 1991, released July 1993).",m:2,g:"m2-nt"},
{t:"Windows NT 4.0",d:"The first widely successful version of Windows NT, released around the same time as Windows 95, sporting the Windows 95 look.",m:2,g:"m2-nt"},
{t:"Windows NT Workstation vs. Windows NT Server",d:"NT Workstation was a stable, secure graphical OS for end users; NT Server was a multiuser server OS for Windows and other OS clients.",m:2,g:"m2-nt"},
{t:"Windows NT networking protocols",d:"Supported TCP/IP (Internet standard), NetBEUI (proprietary Windows file sharing), IPX/SPX (Novell NetWare), DLC (IBM mainframes), and AppleTalk (Apple computers).",m:2,g:"m2-nt"},
{t:"C2 security rating",d:"Windows NT 4.0 Server received a C2 top-secret U.S. government security rating covering file/folder protection, accounts & passwords, auditing, and access controls.",m:2,g:"m2-nt"},
{t:"Domain (Windows NT)",d:"An administrative and security boundary within which all member computers are subject to common administrative and security policies.",m:2,g:"m2-nt"},
{t:"Primary domain controller (PDC)",d:"In a Windows NT domain, the one server responsible for keeping all usernames/passwords; other servers requested info from it. Precursor to Active Directory.",m:2,g:"m2-nt"},
{t:"Single sign-on",d:"A feature of the Windows NT domain model letting a user sign on once and gain access to any computer that's a member of the domain.",m:2,g:"m2-nt"},
{t:"NTFS (New Technology File System)",d:"Introduced in Windows NT; provides file- and folder-level permissions. Still the primary file system on all Windows OSs.",m:2,g:"m2-nt"},
{t:"Windows on Windows (WOW) / NTVDM",d:"A Windows NT subsystem that lets 16-bit applications run preemptively multitasked in a virtual DOS environment (NT Virtual DOS Machine), reducing freezes.",m:2,g:"m2-nt"},

// ---- WINDOWS 2000 & ACTIVE DIRECTORY ----
{t:"Windows 2000",d:"Built on Windows NT technology; kernel rewrite ran ~30% faster, added VPN support, driver signing, and introduced Active Directory.",m:2,g:"m2-2000"},
{t:"Virtual private network (VPN)",d:"A private network providing authentication and encryption while running over a non-secure network like the Internet, introduced with Windows 2000.",m:2,g:"m2-2000"},
{t:"Driver signing",d:"A Windows 2000 feature ensuring device drivers can't be inadvertently overwritten by earlier versions and only certified drivers can be installed.",m:2,g:"m2-2000"},
{t:"Active Directory",d:"Introduced in Windows 2000 Server; the core service/database of a Windows domain, providing single-point user authentication/authorization and resource management via organizational units.",m:2,g:"m2-2000"},
{t:"Organizational units",d:"Folders within Active Directory used to organize resources hierarchically, much like a file system organizes files in folders/subfolders.",m:2,g:"m2-2000"},
{t:"Domain controller (DC) — Windows 2000 change",d:"Unlike NT's single read/write PDC + read-only BDCs, every Windows 2000 DC could create and change Active Directory info; DCs synchronize via replication.",m:2,g:"m2-2000"},
{t:"Backup domain controller (BDC)",d:"In Windows NT Server 4.0, a server holding a read-only copy of account/security info as a backup to the PDC.",m:2,g:"m2-2000"},
{t:"Replication",d:"The process by which domain controllers periodically synchronize Active Directory information with each other.",m:2,g:"m2-2000"},
{t:"Kerberos",d:"A security system/authentication protocol (added in Windows 2000) providing mutual authentication between client and server using encrypted tickets instead of sending passwords across the network.",m:2,g:"m2-2000"},
{t:"IntelliMirror",d:"A Windows 2000 concept enabling clients to access the same desktop settings/apps/files anywhere; enabled roaming profiles, folder redirection, and offline files.",m:2,g:"m2-2000"},
{t:"Windows 2000 editions",d:"Server, Advanced Server, and Datacenter Server, differing mainly in CPU/memory support; Advanced/Datacenter also supported server clustering.",m:2,g:"m2-2000"},

// ---- WINDOWS XP & SERVER 2003 ----
{t:"Windows XP & Windows Server 2003",d:"The two products Windows 2000 evolved into, both built on the Windows 2000 kernel; XP was the desktop version, Server 2003 the server version.",m:2,g:"m2-xp"},
{t:"Activation",d:"A mechanism to prevent software piracy, first required by Windows XP; the OS could be activated online or by phone, with the code linked to a specific computer.",m:2,g:"m2-xp"},
{t:"Windows XP Professional",d:"Intended for office/professional use; supported multiple user accounts and could act as a small server for up to 10 users, like Windows 2000 Professional.",m:2,g:"m2-xp"},
{t:"Windows Server 2003/R2 new features",d:"XP-style GUI, faster Active Directory logon, hundreds of new group policies, 64-bit Itanium support, Remote Desktop management, Terminal Services, and .NET runtime.",m:2,g:"m2-xp"},
{t:"Distributed File System (DFS)",d:"A valuable Windows Server 2003 R2 feature (along with clustered servers and group policies) for managing files across an enterprise network.",m:2,g:"m2-xp"},

// ---- WINDOWS VISTA & 7 ----
{t:"Windows 7",d:"Released after Windows Vista; known for simply \"working,\" with faster performance (~1/3 faster than XP/2000), enhanced search, and the Aero desktop presentation.",m:2,g:"m2-vista7"},
{t:"Windows Vista",d:"The version between XP and 7; poorly received due to early reliability/driver problems, quickly followed by Windows 7 to mitigate reputation damage.",m:2,g:"m2-vista7"},
{t:"Aero",d:"Windows 7's \"unified presentation subsystem\" desktop (Authentic, Energetic, Reflective, Open) offering consistent window design and 3D \"Glass\" visual effects.",m:2,g:"m2-vista7"},
{t:"User Account Protection (UAP) / User Account Control (UAC)",d:"Introduced in Windows Vista; warns users when apps/tools are about to change critical system settings, limiting the risk of running everything as administrator.",m:2,g:"m2-vista7"},
{t:"Windows Service Hardening (WSH)",d:"A Windows 7 feature that restricts a service (like FTP) from performing activities in critical OS structures, limiting damage if that service is compromised.",m:2,g:"m2-vista7"},
{t:"Connection security rules / IPsec",d:"Group policy rules ensuring communication sessions between clients/servers are authenticated and encrypted using the IP Security (IPsec) protocol suite.",m:2,g:"m2-vista7"},

// ---- WINDOWS SERVER 2008 ----
{t:"Windows Server 2008 new features",d:"Read-only domain controller, failover & load-balancing clusters, Hyper-V, self-healing NTFS, Server Core, PowerShell, and Server Manager.",m:2,g:"m2-2008"},
{t:"Read-only domain controller (RODC)",d:"A domain controller (Windows Server 2008) where domain changes can't be initiated locally — changes are written elsewhere and replicated to it. Good for low-security branch offices.",m:2,g:"m2-2008"},
{t:"Failover cluster",d:"Two or more tightly linked servers where one is active and others are standby; if the active server fails, a standby takes over providing services.",m:2,g:"m2-2008"},
{t:"Network load-balancing (NLB) cluster",d:"A server configuration where servers share the load of incoming requests for scalability and fault tolerance; best for TCP/IP apps like Web servers, not database/file/print apps.",m:2,g:"m2-2008"},
{t:"Hyper-V",d:"Microsoft's hypervisor service (introduced Windows Server 2008) allowing Windows Server to host multiple isolated virtual machines on one physical server.",m:2,g:"m2-2008"},
{t:"Self-healing NTFS",d:"A Windows Server 2008 feature where Chkdsk-style repairs run in the background rather than requiring the whole volume to go offline.",m:2,g:"m2-2008"},
{t:"Server Core",d:"A bare-bones Windows Server installation with a limited GUI, managed via command prompt/PowerShell, reducing the attack surface. Default install option since Server 2016/2019.",m:2,g:"m2-2008"},
{t:"PowerShell",d:"A powerful command-line interface and scripting language (standard since Windows Server 2008) using verb-noun \"cmdlets\" like Get-Help or Set-User.",m:2,g:"m2-2008"},
{t:"Server Manager",d:"A tool that combines/replaces older wizards, centralizing server setup, deployment, role management, and status checks in one location.",m:2,g:"m2-2008"},

// ---- WINDOWS 8 & SERVER 2012 ----
{t:"Windows 8/8.1",d:"Released Oct 2012 (8.1 in Oct 2013); intended to unify UI/code base across touch and desktop devices. The touch-centric interface (and missing Start button) was poorly received.",m:2,g:"m2-2012"},
{t:"Storage Spaces",d:"A Windows 8 storage management tool letting users/admins pool disks of different sizes/interfaces into a single storage pool, creating virtual disks/volumes.",m:2,g:"m2-2012"},
{t:"Client Hyper-V",d:"Brought Hyper-V virtualization to Windows client OSs starting with Windows 8, letting you run older Windows versions in a VM alongside the host OS.",m:2,g:"m2-2012"},
{t:"Windows Server 2012",d:"Microsoft's deep dive into the private cloud; editions are Standard, Datacenter, Essentials (25 users or fewer), and Foundation (OEM-only, 15 users).",m:2,g:"m2-2012"},
{t:"Minimal Server Interface (MinShell)",d:"A happy medium between Server Core and the full GUI, letting users perform most local management tasks with a GUI tool but lacking the full interface.",m:2,g:"m2-2012"},
{t:"Resilient File System (ReFS)",d:"A file system introduced in Windows Server 2012 for large, highly reliable data storage; backward-compatible with NTFS but lacks features like file compression, disk quotas, and EFS.",m:2,g:"m2-2012"},
{t:"Dynamic Access Control (DAC)",d:"Gives fine-tuned control over shared resources based on user attributes/file classification rather than only group-based permissions.",m:2,g:"m2-2012"},

// ---- WINDOWS 10 & SERVER 2016/2019 ----
{t:"Windows 10",d:"Released July 2015 (jumping from 8.1, skipping \"9\"); may be the last numbered Windows release, with regular feature updates (e.g., v1507, v1903) instead of new version names.",m:2,g:"m2-2016"},
{t:"Virtual desktops (Windows 10)",d:"Let users create multiple desktops and switch between them to organize open application windows — a feature long available on Linux desktop managers.",m:2,g:"m2-2016"},
{t:"Cortana",d:"Windows 10's digital assistant (like Siri/Google Assistant), requiring a Microsoft account; accessed via the search bar, used for voice commands, reminders, and questions.",m:2,g:"m2-2016"},
{t:"Windows Hello",d:"A Windows 10 sign-in feature letting you use facial recognition or a fingerprint (with compatible hardware) instead of just a password or PIN.",m:2,g:"m2-2016"},
{t:"Windows Sandbox",d:"First available in Windows 10 v1903; a temporary, isolated desktop environment for running untrusted/experimental apps without affecting the host OS. Needs 4 GB RAM & 2 cores.",m:2,g:"m2-2016"},
{t:"Windows Server 2016",d:"Comes with the Windows 10 UI; introduced Nano Server and expanded virtualization with Windows Server Containers and Hyper-V Containers.",m:2,g:"m2-2016"},
{t:"Nano Server",d:"A Windows Server 2016 install option even smaller than Server Core, with no local logon (remote management only); can only run in a Windows container starting with version 1709.",m:2,g:"m2-2016"},
{t:"Windows Containers",d:"Server 2016's two container options: Windows Server Containers (moderate isolation, shared kernel) and Hyper-V Containers (VM-level isolation without full VM overhead).",m:2,g:"m2-2016"},
{t:"Windows Server 2019",d:"Focuses on hybrid cloud datacenters, security, and hyper-converged infrastructure (HCI); introduced Windows Admin Center and deeper Linux integration (WSL, encrypted Linux VMs).",m:2,g:"m2-2016"},
{t:"Windows Admin Center (WAC)",d:"A browser-based management console (introduced in Server 2019) for managing servers, clusters, Windows 10 clients, and HCI, with tight Azure integration.",m:2,g:"m2-2016"},

<script>

const MODNAME = {1:"Module 1 &middot; OS Fundamentals", 2:"Module 2 &middot; Client/Server OSs", 3:"Module 3 &middot; The CPU"};
const MODCLASS = {1:"", 2:"violet", 3:"teal"};
const MODSHORT = {1:"OS", 2:"Client/Server", 3:"CPU"};

function groupsFor(m){ return GROUPS.filter(g=>g.m===m); }
function groupTitle(key){ const g = GROUPS.find(g=>g.key===key); return g?g.title:""; }
function cardsForModule(m){ return m==="all" ? FLASHCARDS : FLASHCARDS.filter(c=>c.m===Number(m)); }
function cardsForGroup(key){ return FLASHCARDS.filter(c=>c.g===key); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}
// lenient term matching so typed recall isn't defeated by punctuation/aliasing
function normTerm(s){
  return String(s)
    .toLowerCase()
    .replace(/\([^)]*\)/g," ")           // drop parenthetical asides
    .replace(/["“”]/g," ")
    .replace(/[\/\-–—,.]/g," ")
    .replace(/\b(a|an|the)\b/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function isLikelyMatch(typed, term){
  const a = normTerm(typed), b = normTerm(term);
  if(!a) return false;
  if(a===b) return true;
  // accept if the typed text is a solid chunk of the term or vice versa
  if(b.includes(a) && a.length >= Math.max(3, b.length*0.5)) return true;
  if(a.includes(b) && b.length >= 3) return true;
  return false;
}

function renderScopePicker(container, currentScope, onPick, idPrefix){
  let html = `<div class="filterrow" id="${idPrefix}ModRow">
      <button class="fbtn ${currentScope.type==='all'?'active':''}" data-m="all">All modules (${FLASHCARDS.length})</button>
      <button class="fbtn ${currentScope.type==='module'&&currentScope.m===1?'active':''}" data-m="1">Module 1 (${cardsForModule(1).length})</button>
      <button class="fbtn violet ${currentScope.type==='module'&&currentScope.m===2?'active':''}" data-m="2">Module 2 (${cardsForModule(2).length})</button>
      <button class="fbtn teal ${currentScope.type==='module'&&currentScope.m===3?'active':''}" data-m="3">Module 3 (${cardsForModule(3).length})</button>
    </div>`;

  const activeModule = currentScope.type==="module" ? currentScope.m : (currentScope.type==="group" ? FLASHCARDS.find(c=>c.g===currentScope.key).m : null);

  if(activeModule){
    const cls = MODCLASS[activeModule];
    html += `<div class="groupgrid" id="${idPrefix}GroupRow">`;
    groupsFor(activeModule).forEach(g=>{
      const active = currentScope.type==="group" && currentScope.key===g.key;
      html += `<button class="groupchip ${cls} ${active?'active':''}" data-g="${g.key}">
        <span class="gt">${escapeHtml(g.title)}</span>
        <span class="gc mono">${cardsForGroup(g.key).length}</span>
      </button>`;
    });
    html += `</div>`;
  }

  container.innerHTML = html;
  container.querySelectorAll(`#${idPrefix}ModRow .fbtn`).forEach(b=>{
    b.onclick = ()=>{
      const m = b.dataset.m;
      onPick(m==="all" ? {type:"all"} : {type:"module", m:Number(m)});
    };
  });
  const gr = container.querySelector(`#${idPrefix}GroupRow`);
  if(gr){
    gr.querySelectorAll(".groupchip").forEach(b=>{
      b.onclick = ()=>{
        const key = b.dataset.g;
        // toggle: clicking the active group returns to whole-module scope
        if(currentScope.type==="group" && currentScope.key===key){
          onPick({type:"module", m:activeModule});
        } else {
          onPick({type:"group", key});
        }
      };
    });
  }
}

   FLASHCARD SCOPE SCREEN
   ========================================================= */

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
    </div>
    <div class="hero" style="margin-bottom:8px;">
      <h1 style="font-size:26px; max-width:none;">Choose what to study</h1>
      <p class="lead" style="margin-bottom:20px;">Pick a module, then narrow to one group if you want to see a whole topic at once.</p>
    </div>
    <div id="scopePicker"></div>
    <button class="startbtn" id="startFlashBtn">Start studying &rarr;</button>
  `;
  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };

/* =========================================================
   FLASHCARDS (study)
   ========================================================= */
function startFlash(scope){
  fsScope = scope;
  fsDeck = scopeCards(scope);
  fsIndex = 0;
  fsFlipped = false;
  view = "flash";
  renderFlash();
}

function renderFlash(){
  const el = document.getElementById("app");
  if(fsMode === "list"){ renderFlashList(el); return; }

  const item = fsDeck[fsIndex];
  const cls = MODCLASS[item.m];

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backScope">&larr; ${escapeHtml(scopeLabel(fsScope))}</button>
      <div class="segwrap">
        <button class="seg active" id="modeFlip">Flip</button>
        <button class="seg" id="modeList">List</button>
      </div>
    </div>

    <div class="progwrap">
      <div class="progtext"><span>Card <b>${fsIndex+1}</b> of ${fsDeck.length}</span><span>${escapeHtml(groupTitle(item.g))}</span></div>
      <div class="progbar"><div class="progfill" style="width:${((fsIndex+1)/fsDeck.length)*100}%"></div></div>
    </div>

    <div class="cardstage">
      <div class="flashcard ${fsFlipped?'flipped':''}" id="flashcardEl">
        <div class="face front ${cls}">
          <div class="modlabel mono">${MODNAME[item.m]} &middot; ${escapeHtml(groupTitle(item.g))}</div>
          <div class="termtext">${escapeHtml(item.t)}</div>
          <div class="hint mono">tap to flip</div>
        </div>
        <div class="face back ${cls}">
          <div class="modlabel mono">DEFINITION</div>
          <div class="deftext">${escapeHtml(item.d)}</div>
          <div class="hint mono">tap to flip</div>
        </div>
      </div>
    </div>

    <div class="cardnav">
      <div class="navbtns">
        <button class="navbtn" id="prevBtn" ${fsIndex===0?'disabled':''}>&larr; Prev</button>
        <button class="navbtn primary" id="nextBtn">${fsIndex===fsDeck.length-1?'Restart':'Next'} &rarr;</button>
      </div>
      <button class="iconbtn" id="shuffleBtn" title="Shuffle">&#8635;</button>
    </div>
  `;

  document.getElementById("backScope").onclick = ()=>{ view="flashscope"; renderFlashScope(); };
  document.getElementById("modeFlip").onclick = ()=>{ fsMode="flip"; renderFlash(); };
  document.getElementById("modeList").onclick = ()=>{ fsMode="list"; renderFlash(); };
  document.getElementById("flashcardEl").onclick = ()=>{ fsFlipped=!fsFlipped; document.getElementById("flashcardEl").classList.toggle("flipped"); };
  document.getElementById("prevBtn").onclick = ()=>{ if(fsIndex>0){ fsIndex--; fsFlipped=false; renderFlash(); } };
  document.getElementById("nextBtn").onclick = ()=>{
    if(fsIndex<fsDeck.length-1){ fsIndex++; } else { fsIndex=0; }
    fsFlipped=false; renderFlash();
  };
  document.getElementById("shuffleBtn").onclick = ()=>{ fsDeck = shuffle(fsDeck); fsIndex=0; fsFlipped=false; renderFlash(); };
}

// list view: every card in scope, grouped by section, so a whole set is visible at once
function renderFlashList(el){
  const groupKeys = [...new Set(fsDeck.map(c=>c.g))];
  let body = "";
  groupKeys.forEach(gkey=>{
    const cards = fsDeck.filter(c=>c.g===gkey);
    const m = cards[0].m;
    body += `<div class="sectionlabel">${MODNAME[m]} &middot; ${escapeHtml(groupTitle(gkey))} &middot; ${cards.length} terms</div>`;
    cards.forEach((c,i)=>{
      const id = `${gkey}__${i}`;
      body += `
        <div class="listcard" data-id="${id}">
          <button class="listhead">
            <span class="lt">${escapeHtml(c.t)}</span>
            <span class="lx mono">+</span>
          </button>
          <div class="listbody">${escapeHtml(c.d)}</div>
        </div>`;
    });
  });

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backScope">&larr; ${escapeHtml(scopeLabel(fsScope))}</button>
      <div class="segwrap">
        <button class="seg" id="modeFlip">Flip</button>
        <button class="seg active" id="modeList">List</button>
      </div>
    </div>
    <div class="listtoolbar">
      <div class="progtext mono" style="margin:0;">${fsDeck.length} terms in view</div>
      <button class="navbtn" id="expandAllBtn">Expand all</button>
    </div>
    ${body}
  `;

  document.getElementById("backScope").onclick = ()=>{ view="flashscope"; renderFlashScope(); };
  document.getElementById("modeFlip").onclick = ()=>{ fsMode="flip"; fsIndex=0; fsFlipped=false; renderFlash(); };
  document.getElementById("modeList").onclick = ()=>{ renderFlash(); };
  el.querySelectorAll(".listcard").forEach(card=>{
    card.querySelector(".listhead").onclick = ()=>{ card.classList.toggle("open"); };
  });
  let expanded = false;
  document.getElementById("expandAllBtn").onclick = ()=>{
    expanded = !expanded;
    el.querySelectorAll(".listcard").forEach(c=>c.classList.toggle("open", expanded));
    document.getElementById("expandAllBtn").textContent = expanded ? "Collapse all" : "Expand all";
  };
}

   QUIZ SETUP

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
    </div>
    <div class="hero" style="margin-bottom:8px;">
      <h1 style="font-size:26px; max-width:none;">Set up your quiz</h1>
      <p class="lead" style="margin-bottom:20px;">Choose a scope, a quiz type, and a direction. The quiz always covers the whole set you pick &mdash; nothing gets left out.</p>
    </div>

    <div class="segrow">
      <div class="seglabel">Quiz type</div>
      <div class="segwrap">
        <button class="seg ${qzType==='id'?'active':''}" id="typeId">Identification &mdash; type the term</button>
        <button class="seg ${qzType==='match'?'active':''}" id="typeMatch">Multiple choice</button>
      </div>
    </div>

    <div class="segrow">
      <div class="seglabel">Direction</div>
      <div class="segwrap">
        <button class="seg ${qzDir==='d2t'?'active':''}" id="dirD2T">Definition &rarr; Term</button>
        <button class="seg ${qzDir==='t2d'?'active':''}" id="dirT2D">Term &rarr; Definition</button>

    </div>

    <div class="sectionlabel" style="margin-top:6px;">Scope</div>

  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };

/* =========================================================
   QUIZ
   ========================================================= */
function startQuiz(scope){
  qzScope = scope;
  qzDeck = shuffle(scopeCards(scope));
  qzIndex = 0;
  qzScore = 0;
  qzAnswered = false;
  qzWrongList = [];
  view = "quiz";
  renderQuiz();
}

function quizPrompt(item){
  return qzDir==="d2t" ? item.d : item.t;
}
function quizAnswer(item){
  return qzDir==="d2t" ? item.t : item.d;
}

function renderQuiz(){
  if(qzType==="id") renderQuizId();
  else renderQuizMatch();
}

function quizHeadHtml(item){
  return `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
      <div class="scorepill mono">Score <b>${qzScore}</b> / ${qzIndex + (qzAnswered?1:0)}</div>
    </div>
    <div class="progwrap">
      <div class="progtext"><span>Question <b>${qzIndex+1}</b> of ${qzDeck.length}</span><span>${escapeHtml(scopeLabel(qzScope))} &middot; ${escapeHtml(groupTitle(item.g))}</span></div>
      <div class="progbar"><div class="progfill" style="width:${(qzIndex/qzDeck.length)*100}%"></div></div>
    </div>
  `;
}

/* ---- Identification: type the term/definition, self-checked with lenient match ---- */
function renderQuizId(){
  const el = document.getElementById("app");
  const item = qzDeck[qzIndex];
  const modClass = MODCLASS[item.m];
  const askingForTerm = qzDir==="d2t";

  el.innerHTML = `
    ${quizHeadHtml(item)}
    <div class="qcard">
      <div class="qmod ${modClass} mono">${MODNAME[item.m]} &middot; ${askingForTerm?'IDENTIFY THE TERM':'IDENTIFY THE DEFINITION'}</div>
      <div class="qtext">${escapeHtml(quizPrompt(item))}</div>
      <div class="idform" id="idForm">
        <input class="idinput" id="idInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="${askingForTerm?'Type the term…':'Type a short definition…'}">
        <button class="idsubmit" id="idSubmit">Check</button>
      </div>
      <div class="idresult" id="idResult"></div>
    </div>
    <div class="quizfoot">
      <button class="navbtn primary hidden" id="nextQBtn">${qzIndex===qzDeck.length-1 ? 'See results' : 'Next question'} &rarr;</button>
    </div>
  `;

  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  const input = document.getElementById("idInput");
  input.focus();
  qzOverridden = false;

  function submit(){
    if(qzAnswered) return;
    qzAnswered = true;
    const typed = input.value.trim();
    const correctAnswer = quizAnswer(item);
    // grading: strict-ish for term recall, informational only for definition recall
    let isRight;
    if(askingForTerm){
      isRight = isLikelyMatch(typed, item.t);
    } else {
      // definitions vary too much to auto-grade reliably; default to self-review
      isRight = typed.length > 0 && isLikelyMatch(typed.slice(0,40), item.d.slice(0,40));
    }
    if(isRight) qzScore++;
    else qzWrongList.push(item);

    input.disabled = true;
    document.getElementById("idSubmit").disabled = true;

    const box = document.getElementById("idResult");
    box.classList.add("show", isRight?"good":"bad");
    box.innerHTML = `
      <div class="idrow"><span class="k">Your answer</span><span class="v ${isRight?'':'your-term'}">${escapeHtml(typed || "(blank)")}</span></div>
      <div class="idrow"><span class="k">Correct</span><span class="v ${isRight?'':'correct-term'}">${escapeHtml(correctAnswer)}</span></div>
      ${askingForTerm ? '' : '<div class="idrow" style="opacity:.75;"><span class="k">Note</span><span class="v" style="font-weight:400;">Definitions are self-checked &mdash; use your judgment.</span></div>'}
    `;
    if(!isRight){
      const ov = document.createElement("button");
      ov.className = "overridebtn";
      ov.id = "overrideBtn";
      ov.textContent = "Actually, mark this correct";
      ov.onclick = ()=>{
        if(qzOverridden) return;
        qzOverridden = true;
        qzScore++;
        qzWrongList = qzWrongList.filter(w=>w!==item);
        box.classList.remove("bad"); box.classList.add("good");
        ov.classList.add("flipped");
        ov.textContent = "Marked correct";
        document.querySelector(".scorepill").innerHTML = "Score <b>"+qzScore+"</b> / "+(qzIndex+1);
      };
      box.appendChild(ov);
    }

    document.getElementById("nextQBtn").classList.remove("hidden");
    document.querySelector(".scorepill").innerHTML = "Score <b>"+qzScore+"</b> / "+(qzIndex+1);
  }

  document.getElementById("idSubmit").onclick = submit;
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });

  document.getElementById("nextQBtn").onclick = advanceQuiz;
}

/* ---- Multiple choice: definition <-> term, distractors pulled from same scope ---- */
function renderQuizMatch(){
  const el = document.getElementById("app");
  const item = qzDeck[qzIndex];
  const modClass = MODCLASS[item.m];
  const askingForTerm = qzDir==="d2t";
  const letters = ["A","B","C","D"];

  // build 4 options: correct + 3 distractors, preferring same group, then same module, then anywhere
  const correctVal = askingForTerm ? item.t : item.d;
  let pool = cardsForGroup(item.g).filter(c=>c!==item);
  if(pool.length < 3) pool = pool.concat(cardsForModule(item.m).filter(c=>c!==item && !pool.includes(c)));
  if(pool.length < 3) pool = pool.concat(FLASHCARDS.filter(c=>c!==item && !pool.includes(c)));
  const distractors = shuffle(pool).slice(0,3).map(c=> askingForTerm ? c.t : c.d);
  const options = shuffle([correctVal, ...distractors]);
  const correctIndex = options.indexOf(correctVal);

  el.innerHTML = `
    ${quizHeadHtml(item)}
    <div class="qcard">
      <div class="qmod ${modClass} mono">${MODNAME[item.m]} &middot; ${askingForTerm?'WHICH TERM MATCHES?':'WHICH DEFINITION MATCHES?'}</div>
      <div class="qtext">${escapeHtml(quizPrompt(item))}</div>
      <div class="options" id="optionsWrap">
        ${options.map((opt,i)=>`
          <button class="opt" data-i="${i}">
            <span class="letter mono">${letters[i]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedbackBox"></div>
    </div>
    <div class="quizfoot">
      <button class="navbtn primary hidden" id="nextQBtn">${qzIndex===qzDeck.length-1 ? 'See results' : 'Next question'} &rarr;</button>
    </div>
  `;

  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  const optButtons = el.querySelectorAll(".opt");
  optButtons.forEach(btn=>{
    btn.onclick = ()=>{
      if(qzAnswered) return;
      qzAnswered = true;
      const chosen = parseInt(btn.dataset.i,10);
      const isRight = chosen === correctIndex;
      if(isRight) qzScore++;
      else qzWrongList.push(item);

      optButtons.forEach(b=>{
        const i = parseInt(b.dataset.i,10);
        b.disabled = true;
        if(i===correctIndex) b.classList.add("correct");
        else if(i===chosen) b.classList.add("wrong");
        else b.classList.add("dim");
      });

      const fb = document.getElementById("feedbackBox");
      fb.classList.add("show");
      if(isRight){
        fb.classList.add("good");
        fb.innerHTML = "<b>Correct.</b> " + escapeHtml(options[correctIndex]) + " is right.";
      } else {
        fb.classList.add("bad");
        fb.innerHTML = "<b>Not quite.</b> The correct answer is: <b>" + escapeHtml(options[correctIndex]) + "</b>";
      }
      document.getElementById("nextQBtn").classList.remove("hidden");
      document.querySelector(".scorepill").innerHTML = "Score <b>"+qzScore+"</b> / "+(qzIndex+1);
    };
  });

  document.getElementById("nextQBtn").onclick = advanceQuiz;
}

function advanceQuiz(){
  if(qzIndex < qzDeck.length-1){
    qzIndex++;
    qzAnswered = false;
    renderQuiz();
  } else {
    view = "results";
    renderResults();
  }
}

function renderResults(){
  const el = document.getElementById("app");
  const total = qzDeck.length;
  const pct = Math.round((qzScore/total)*100);
  let msg = "Solid — a bit more repetition and you've got it.";
  if(pct>=90) msg = "That's exam-ready. Nice work.";
  else if(pct>=75) msg = "Good grasp overall — review the misses below.";
  else if(pct<50) msg = "Worth another full pass through the flashcards first.";

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
      <div class="scorepill mono">Quiz complete</div>
    </div>
    <div class="qcard results">
      <div class="big mono">${qzScore}/${total}</div>
      <p>${pct}% correct &mdash; ${msg}</p>
      <div class="navbtns" style="justify-content:center; display:flex;">
        <button class="navbtn primary" id="retryBtn">Retry this set</button>
        <button class="navbtn" id="retryWrongBtn" ${qzWrongList.length===0?'disabled':''}>Review ${qzWrongList.length} missed</button>
      </div>
    </div>
    ${qzWrongList.length>0 ? `
    <div class="coverage" style="margin-top:26px;">
      <h4>Terms you missed</h4>
      <ul style="columns:1;">
        ${qzWrongList.map(w=>`<li>${escapeHtml(w.t)} &mdash; <span style="color:var(--muted);">${escapeHtml(w.d)}</span></li>`).join("")}
      </ul>
    </div>` : ""}
  `;
  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  document.getElementById("retryBtn").onclick = ()=>{ startQuiz(qzScope); };
  if(qzWrongList.length>0){
    document.getElementById("retryWrongBtn").onclick = ()=>{
      qzDeck = shuffle(qzWrongList);
      qzIndex = 0; qzScore = 0; qzAnswered = false; qzWrongList = [];
      view = "quiz";
      renderQuiz();
    };
  }
}

/* boot */
renderHome();
</script>
