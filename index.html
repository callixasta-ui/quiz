<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS, Client/Server & CPU Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#11161c;
    --panel:#1a232c;
    --panel-2:#212c37;
    --line: rgba(237,237,230,0.10);
    --text:#edede6;
    --muted:#93a1ad;
    --amber:#e8a33d;
    --amber-dim: rgba(232,163,61,0.16);
    --teal:#57d0bd;
    --teal-dim: rgba(87,208,189,0.16);
    --violet:#b78ce8;
    --violet-dim: rgba(183,140,232,0.16);
    --good:#4fbf78;
    --good-dim: rgba(79,191,120,0.16);
    --bad:#e5654f;
    --bad-dim: rgba(229,101,79,0.14);
    --radius: 10px;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#11161c; --panel:#1a232c; --panel-2:#212c37; --text:#edede6; --muted:#93a1ad;
    }
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(87,208,189,0.07), transparent 60%),
      radial-gradient(900px 600px at -10% 10%, rgba(232,163,61,0.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;}
  .serif{font-family:"IBM Plex Serif", Georgia, serif;}

  .wrap{max-width:880px; margin:0 auto; padding:28px 20px 64px;}

  /* ---- Top bar / brand ---- */
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px; cursor:pointer; width:max-content;}
  .brand .chip{
    width:30px; height:30px; border-radius:7px;
    background: linear-gradient(155deg, var(--amber), #b97a1f);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono"; font-weight:700; font-size:13px; color:#1a1206;
    flex:none;
  }
  .brand .name{font-size:15px; letter-spacing:0.02em; color:var(--muted);}
  .brand .name b{color:var(--text); font-weight:600;}

  /* ---- HERO / HOME ---- */
  .hero h1{
    font-family:"IBM Plex Serif"; font-weight:600; font-style:italic;
    font-size: clamp(30px, 6vw, 46px); line-height:1.08; margin:0 0 14px;
    max-width: 13ch;
  }
  .hero p.lead{color:var(--muted); font-size:16px; line-height:1.6; max-width:56ch; margin:0 0 28px;}

  .statrow{display:flex; gap:22px; flex-wrap:wrap; margin-bottom:34px;}
  .stat{padding:14px 0; border-top:1px solid var(--line); min-width:120px;}
  .stat .n{font-family:"IBM Plex Mono"; font-size:26px; font-weight:600; color:var(--teal);}
  .stat .l{font-size:12.5px; color:var(--muted); margin-top:3px;}

  .modecards{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px;}
  @media (max-width:600px){.modecards{grid-template-columns:1fr;}}
  .modecard{
    text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px; cursor:pointer; color:var(--text); font:inherit;
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
    position:relative; overflow:hidden;
  }
  .modecard:hover{border-color:rgba(237,237,230,0.22); background:var(--panel-2);}
  .modecard:active{transform:scale(0.99);}
  .modecard .tag{font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:0.04em; color:var(--amber); margin-bottom:10px; display:block;}
  .modecard.teal .tag{color:var(--teal);}
  .modecard h3{margin:0 0 8px; font-size:19px; font-weight:600;}
  .modecard p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.5;}
  .modecard .led{
    position:absolute; top:20px; right:20px; width:9px; height:9px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px 1px var(--amber);
  }
  .modecard.teal .led{background:var(--teal); box-shadow:0 0 10px 1px var(--teal);}

  .coverage{border-top:1px solid var(--line); padding-top:20px;}
  .coverage h4{font-size:12.5px; text-transform:none; letter-spacing:0.01em; color:var(--muted); margin:0 0 10px; font-weight:500;}
  .coverage ul{margin:0; padding-left:18px; color:var(--text); font-size:14px; line-height:1.9; columns:2; column-gap:26px;}
  @media (max-width:560px){.coverage ul{columns:1;}}
  .coverage li::marker{color:var(--muted);}

  /* ---- shared top controls for study/quiz views ---- */
  .viewhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .back{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .back:hover{color:var(--text); border-color:rgba(237,237,230,0.25);}

  .filterrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .fbtn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 14px; font:inherit; font-size:12.5px; cursor:pointer;
    font-family:"IBM Plex Mono";
  }
  .fbtn.active{background:var(--amber-dim); border-color:rgba(232,163,61,0.5); color:var(--amber);}
  .fbtn.active.teal{background:var(--teal-dim); border-color:rgba(87,208,189,0.5); color:var(--teal);}
  .fbtn.active.violet{background:var(--violet-dim); border-color:rgba(183,140,232,0.5); color:var(--violet);}

  .progwrap{margin-bottom:22px;}
  .progtext{display:flex; justify-content:space-between; font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); margin-bottom:7px;}
  .progtext b{color:var(--text); font-weight:600;}
  .progbar{height:5px; border-radius:4px; background:rgba(237,237,230,0.08); overflow:hidden;}
  .progfill{height:100%; background:linear-gradient(90deg, var(--amber), var(--teal)); width:0%; transition:width .25s ease;}

  /* ---- FLASHCARDS ---- */
  .cardstage{perspective:1600px; margin-bottom:22px;}
  .flashcard{
    position:relative; width:100%; min-height:300px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    border:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; justify-content:center; padding:38px 34px;
  }
  .face.back{transform:rotateY(180deg); background:var(--panel-2);}
  .face .modlabel{font-family:"IBM Plex Mono"; font-size:11px; color:var(--amber); letter-spacing:0.04em; margin-bottom:16px;}
  .face.teal .modlabel{color:var(--teal);}
  .face.violet .modlabel{color:var(--violet);}
  .face .termtext{font-family:"IBM Plex Serif"; font-weight:600; font-size: clamp(22px,4vw,30px); line-height:1.25;}
  .face .deftext{font-size:16.5px; line-height:1.6; color:var(--text);}
  .face .hint{position:absolute; bottom:16px; right:20px; font-family:"IBM Plex Mono"; font-size:11px; color:var(--muted);}

  .cardnav{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .navbtns{display:flex; gap:8px;}
  .navbtn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 16px; font:inherit; font-size:14px; cursor:pointer;
  }
  .navbtn:hover{border-color:rgba(237,237,230,0.28);}
  .navbtn.primary{background:var(--teal-dim); border-color:rgba(87,208,189,0.45); color:var(--teal); font-weight:600;}
  .navbtn:disabled{opacity:0.35; cursor:default;}
  .iconbtn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    width:38px; height:38px; font:inherit; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{color:var(--text);}

  /* ---- QUIZ ---- */
  .scorepill{
    font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }
  .scorepill b{color:var(--good);}
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:30px 28px; margin-bottom:18px;
  }
  .qmod{font-family:"IBM Plex Mono"; font-size:11px; color:var(--amber); margin-bottom:14px; letter-spacing:0.04em;}
  .qmod.teal{color:var(--teal);}
  .qmod.violet{color:var(--violet);}
  .qtext{font-family:"IBM Plex Serif"; font-size: clamp(19px,3.2vw,23px); font-weight:600; line-height:1.4; margin-bottom:24px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:14px 16px; font:inherit; font-size:15px; cursor:pointer;
    display:flex; align-items:center; gap:12px; transition:border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled){border-color:rgba(237,237,230,0.3);}
  .opt:disabled{cursor:default;}
  .opt .letter{
    font-family:"IBM Plex Mono"; font-size:12px; color:var(--muted); width:22px; height:22px; border-radius:6px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .opt.correct{background:var(--good-dim); border-color:rgba(79,191,120,0.55);}
  .opt.correct .letter{color:var(--good); border-color:rgba(79,191,120,0.55);}
  .opt.wrong{background:var(--bad-dim); border-color:rgba(229,101,79,0.55);}
  .opt.wrong .letter{color:var(--bad); border-color:rgba(229,101,79,0.55);}
  .opt.dim{opacity:0.45;}

  .feedback{
    margin-top:18px; padding:14px 16px; border-radius:10px; font-size:14.5px; line-height:1.55;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-dim); border:1px solid rgba(79,191,120,0.4); color:#bdeccf;}
  .feedback.bad{background:var(--bad-dim); border:1px solid rgba(229,101,79,0.4); color:#f6c9c1;}
  .feedback b{color:var(--text);}

  .quizfoot{display:flex; justify-content:flex-end; margin-top:6px;}

  /* results */
  .results{text-align:center; padding:30px 10px;}
  .results .big{font-family:"IBM Plex Mono"; font-size:52px; font-weight:700; color:var(--teal); margin-bottom:6px;}
  .results p{color:var(--muted); margin:0 0 26px;}

  footer.note{color:var(--muted); font-size:12.5px; text-align:center; margin-top:40px; line-height:1.6;}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    .flashcard{transition:none;} .progfill{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const FLASHCARDS = [
// ---- MODULE 1: OS FUNDAMENTALS ----
{t:"Operating system (OS)",d:"A computer program that provides a user interface, storage management (file system), process/service management, memory & I/O management, security & resource protection, and a kernel.",m:1},
{t:"User interface",d:"The OS feature that lets users interact with the computer, typically via keyboard/mouse or touch.",m:1},
{t:"File system",d:"The method by which an OS stores and organizes files and manages access to them on a storage device.",m:1},
{t:"Process",d:"A program that has been loaded into memory and is run by the CPU.",m:1},
{t:"Service",d:"The Windows term for a process without a user interface that runs in the background.",m:1},
{t:"Daemon",d:"The Linux term for a process without a user interface that runs in the background (same idea as a Windows \"service\").",m:1},
{t:"Kernel",d:"The heart of the OS. It runs with the highest priority and handles scheduling, memory/I/O management, and security.",m:1},
{t:"Single-tasking operating system",d:"An OS that can execute only a single process at a time (e.g., CP/M, MS-DOS, Palm OS, iOS 3 and earlier).",m:1},
{t:"Multitasking operating system",d:"An OS that quickly switches between all processes loaded into memory so multiple programs appear to run at once.",m:1},
{t:"iOS 3 (and earlier)",d:"A single-tasking OS for iPhone/iPad — only the foreground app received CPU time.",m:1},
{t:"iOS 4 / iOS 4.2",d:"iOS 4 (June 2010) brought multitasking to iPhone; iOS 4.2 (Nov 2010) allowed multitasking on iPad.",m:1},
{t:"CP/M, PC-DOS, MS-DOS",d:"Command-line, single-tasking OSs; the original operating systems on the IBM PC in the early 1980s.",m:1},
{t:"Personal digital assistant (PDA)",d:"A handheld device running email, calendar, note-taking, and web apps, but without an integrated phone (e.g., ran Palm OS).",m:1},
{t:"Embedded system",d:"A computing device designed for one specific task (e.g., a dishwasher controller or car braking system), often single-tasking.",m:1},
{t:"Cooperative multitasking",d:"The OS gives CPU control to a process and waits for it to terminate or enter a waiting state before giving control to the next process. Used by Windows until Windows 95.",m:1},
{t:"Preemptive multitasking",d:"The OS strictly controls CPU time, giving each process a time slice based on interrupts, priority, or the timer expiring. Used by modern server/desktop/laptop OSs.",m:1},
{t:"Single-user operating system",d:"Allows only one user at a time to interact with the OS UI, start processes, and access the file system directly (e.g., Windows 10, iOS, Android).",m:1},
{t:"Remote Desktop Protocol (RDP)",d:"A protocol allowing a user to remotely sign in to a Windows 10 system — but only if no user is signed in at the local console.",m:1},
{t:"Multiuser operating system",d:"Allows multiple users to sign in, start/stop processes, use the UI, and access the local file system simultaneously (e.g., Linux/UNIX, Windows Server via RDP).",m:1},
{t:"General-purpose operating system",d:"Designed to provide a convenient UI and run business, productivity, or entertainment apps with reasonable (not guaranteed) performance.",m:1},
{t:"Real-time operating system (RTOS)",d:"Designed to process inputs and produce outputs in a very specific, repeatable amount of time (e.g., VxWorks, QNX, LynxOS, Windows 10 IoT).",m:1},
{t:"Deterministic",d:"Describes components of a real-time system (like network/storage) for which worst-case response times can be determined under given conditions.",m:1},
{t:"The three OS roles",d:"Client, Server, and Standalone.",m:1},
{t:"Client operating system",d:"An OS whose primary purpose is to run applications requested by a user and request data from network servers (e.g., Windows 10, macOS, Ubuntu Desktop).",m:1},
{t:"Server operating system",d:"An OS whose primary purpose is to share network resources (storage, printers) and provide network services to clients (e.g., Windows Server, UNIX, many Linux distros).",m:1},
{t:"Windows Server Core",d:"The default installation of Windows Server — it has no GUI, requiring administrators to use the command-line interface.",m:1},
{t:"Standalone operating system",d:"An OS not designed to interact with other OSs or access network resources — most common today in embedded systems.",m:1},
{t:"Fault tolerance",d:"The ability of a system to recover from a hardware or software failure.",m:1},
{t:"Clustering",d:"The ability of two or more servers to act as one, for fault tolerance, load sharing, or both.",m:1},
{t:"Failover cluster",d:"A server cluster for fault tolerance: two or more servers share identical configurations and data access; if one fails, another takes over.",m:1},
{t:"Load-sharing (load-balancing) cluster",d:"Two or more servers alternate taking client requests to provide faster response times.",m:1},
{t:"Hot swapping",d:"Replacing a failed hardware component (disk, memory, processor) without shutting the system down.",m:1},
{t:"Hot adding",d:"Adding new components (storage, RAM, processors) to a running system, supporting scalability.",m:1},
{t:"Boot procedure — 6 steps",d:"1) Power applied 2) CPU starts 3) CPU executes firmware startup routines 4) OS is located by firmware 5) OS loaded into RAM 6) OS processes/services are started.",m:1},
{t:"Firmware",d:"Program code stored in non-volatile memory on hardware; performs diagnostic tests and boots the OS.",m:1},
{t:"Non-volatile memory",d:"Memory that keeps its contents even when no power is applied (e.g., flash memory, EEPROM).",m:1},
{t:"Bootstrap",d:"The initial program contained in firmware that locates and loads the bootloader program.",m:1},
{t:"Bootloader",d:"The program (loaded by the bootstrap) responsible for loading the initial process that makes up the operating system.",m:1},
{t:"BOOTMGR",d:"The Windows bootloader used from Windows Vista onward (NTLDR was used in older Windows).",m:1},
{t:"GRUB / LILO",d:"Common bootloaders used by Linux systems.",m:1},
{t:"BIOS (basic input/output system)",d:"Firmware residing on a motherboard chip that initializes I/O devices, runs POST, and locates/loads the OS.",m:1},
{t:"UEFI",d:"Unified Extensible Firmware Interface — the newer form of firmware used on modern PCs in place of legacy BIOS.",m:1},
{t:"Power-on self-test (POST)",d:"Tests performed by the BIOS at startup, such as memory and hardware component tests.",m:1},
{t:"CMOS chip",d:"A low-power memory chip, powered by a small battery, that stores the BIOS configuration.",m:1},
{t:"Kernel mode (privileged mode)",d:"A CPU mode in which a process has unrestricted access to hardware and can execute privileged CPU instructions.",m:1},
{t:"User mode",d:"A CPU mode in which a process can only access memory allocated to it, must ask the OS for I/O access, and cannot run privileged instructions.",m:1},
{t:"Process ID (PID)",d:"A unique identifier assigned to a process when created, used to communicate with or manage it.",m:1},
{t:"ps (Linux command)",d:"Lists the processes you've started in Linux, including their PIDs.",m:1},
{t:"kill PID (Linux command)",d:"Terminates a process by its process ID.",m:1},
{t:"Four ways a process is created",d:"1) By the bootloader 2) Through a request by the OS 3) By another process (parent/child) 4) By a user.",m:1},
{t:"Parent process / child process",d:"When a process creates another process, the creator is the parent and the new process is the child.",m:1},
{t:"systemd (or init)",d:"On Linux, the first user mode process started at boot; responsible for starting most other user mode processes.",m:1},
{t:"Windows Session Manager loads...",d:"...wininit and winlogon after kernel mode processes and device drivers are loaded.",m:1},
{t:"wininit",d:"Starts most of the services configured to start when Windows boots.",m:1},
{t:"winlogon",d:"Handles the Windows user logon procedure, calls lsass to verify credentials, and starts the Desktop Window Manager (dwm).",m:1},
{t:"lsass",d:"The authentication service used on Windows to verify user credentials.",m:1},
{t:"Desktop Window Manager (dwm)",d:"The process that manages much of the Windows 10 user interface.",m:1},
{t:"Device driver",d:"Usually a kernel mode process that accesses hardware devices directly on behalf of user mode or other kernel mode processes.",m:1},
{t:"File handle",d:"An identifier for a file containing all the information the file system needs to locate and access that file.",m:1},
{t:"Polling",d:"An I/O handling method where the OS checks each device one after another, round-robin, to see if it needs attention — generally inefficient.",m:1},
{t:"Interrupt",d:"A signal, usually generated by an I/O device, that alerts the CPU/OS that a device needs attention.",m:1},
{t:"Interrupt request (IRQ) line",d:"A pin on the CPU that changes state when a hardware interrupt signal is generated.",m:1},
{t:"Interrupt service routine (ISR)",d:"Also called an interrupt handler; the code executed when an interrupt occurs — calls the relevant device driver.",m:1},
{t:"Interrupt masking",d:"ISRs turn off interrupts of equal or lower priority while they run, to prevent unnecessary interruptions.",m:1},
{t:"Non-maskable interrupt (NMI)",d:"A class of interrupt that cannot be turned off; reserved for error conditions like divide-by-zero or memory errors.",m:1},
{t:"Trap",d:"A software interrupt, generated by user mode programs when they need immediate kernel services.",m:1},
{t:"Authentication",d:"Verifies that an account trying to access a system is valid and has provided valid credentials.",m:1},
{t:"Authorization",d:"Verifies that an authenticated account has permission to perform a specific action, like opening a file.",m:1},
{t:"ntoskrnl.exe",d:"The name of the kernel file in Windows systems.",m:1},
{t:"XNU",d:"The name of the kernel used in macOS.",m:1},
{t:"uname -sr",d:"The Linux command used to determine kernel information (name and release).",m:1},
{t:"Multics",d:"Widely considered to be the first multiuser, multitasking operating system; ran on PDP series computers and led to UNIX.",m:1},
{t:"UNIX (original)",d:"Developed at AT&T Bell Labs in 1969 by Kenneth Thompson and Dennis Ritchie as an improvement on Multics.",m:1},
{t:"BASIC",d:"Beginner's All-purpose Symbolic Instruction Code — a simple programming language developed at Dartmouth College aimed at nonprogrammers.",m:1},
{t:"MS-DOS",d:"Microsoft Disk Operating System — evolved in 1980 from 86-DOS (originally QDOS), a command-line OS that became a runaway success for Microsoft.",m:1},
{t:"QDOS",d:"The Quick and Dirty Operating System written by Tim Paterson for the 8086 processor; evolved into 86-DOS and then MS-DOS.",m:1},
{t:"Apple Macintosh (1984)",d:"The first widely distributed OS that was totally graphical in its user interface; also introduced use of the mouse to PC-based systems.",m:1},
{t:"Windows 3.0 (1990)",d:"The first usable version of a graphical operating system for the PC.",m:1},
{t:"Windows NT (1993)",d:"Microsoft's first true 32-bit, preemptive multitasking OS with integrated networking; later offered in Workstation and Server versions.",m:1},
{t:"Windows 95",d:"Mostly 32-bit upgrade to Windows 3.x with improved UI and native 32-bit app support; it was still backward compatible with 16-bit apps.",m:1},
{t:"Linux kernel 0.01 (1991)",d:"Linus Torvalds made the very first version of Linux available for download via FTP.",m:1},
{t:"OS/2 (1987)",d:"IBM operating system jointly developed with Microsoft; required extensive hardware and could not run older MS-DOS applications, so it was not a big hit.",m:1},
{t:"Windows Server 2016",d:"Emphasizes virtualization, flexible storage, and cloud computing; introduced Nano Server and Microsoft's first support for containers.",m:1},
{t:"GNOME 1.0 desktop (1999)",d:"Became available as free software and grew to become one of the most popular UNIX/Linux desktops.",m:1},
{t:"SVR4 vs. BSD",d:"The two main design standards for the many \"flavors\" of UNIX: System V Release 4 and the Berkeley Software Distribution.",m:1},
{t:"SAMBA",d:"The Linux equivalent of \"Client for Microsoft Networks,\" used for accessing shared Windows files/printers.",m:1},
{t:"Network File System (NFS)",d:"Linux's native file sharing protocol.",m:1},
{t:"Client vs. server performance tuning",d:"Client OSs are tuned for foreground \"Programs\"; server OSs (like Windows Server) are tuned for \"Background services.\"",m:1},
{t:"Command-line interface",d:"An interface where users type commands instead of using a GUI's point-and-click method (e.g., original MS-DOS, PowerShell, a Linux shell).",m:1},
{t:"Graphical user interface (GUI)",d:"An interface allowing users to interact by pointing, clicking, or touching icons/menus rather than typing commands. First widely popularized by the 1984 Macintosh.",m:1},
{t:"Computer hardware",d:"The physical components of a computer (CPU, memory, disk, video card, etc.) that are controlled and coordinated by the operating system.",m:1},
{t:"Scalability",d:"A system's ability to grow — for example, supporting hot adding of storage, RAM, or processors while running.",m:1},
{t:"\"Job\" (legacy term)",d:"The old name for a process, dating back to when systems were single-tasking and ran programs one after another (batch processing).",m:1},
{t:"\"Task\" (as in Task Manager)",d:"Another term for a process — Windows' Task Manager is literally a process manager.",m:1},
{t:"Windows Virtual Desktop",d:"A Microsoft Azure feature that provides a true multiuser version of Windows 10 (outside of this, Windows 10 is single-user).",m:1},
{t:"Novell NetWare",d:"An older network server OS that early standalone PCs (like MS-DOS machines) were sometimes upgraded with a network card to connect to.",m:1},
{t:"Windows 7 end of life",d:"January 2020 — Microsoft discontinued support (including security updates) for Windows 7.",m:1},
{t:"Windows Server 2008 / 2012 support",d:"Support for Windows Server 2008 ended in January 2020; support for Windows Server 2012 was scheduled to end in October 2023.",m:1},
{t:"Windows 10 version 1903",d:"The Windows 10 build (released March 2019) that the module's feature descriptions and screenshots are based on.",m:1},
{t:"Process Explorer",d:"A free Sysinternals utility (downloadable from Microsoft) that shows a graphical process tree on Windows systems.",m:1},
{t:"Task Manager",d:"A Windows GUI tool for viewing and managing running processes, performance data, and startup programs.",m:1},
{t:"Resource Monitor",d:"A Windows tool (opened from Task Manager) showing detailed CPU, memory, disk, and network usage per process.",m:1},
{t:"Active Directory",d:"Microsoft's directory service, an example of a service commonly bundled with a server OS.",m:1},
{t:"DHCP client / DNS client",d:"Networking components preinstalled on client OSs, used to automatically get an IP address (DHCP) and resolve names (DNS).",m:1},

// ---- MODULE 2: MODERN CLIENT AND SERVER OPERATING SYSTEMS ----
{t:"MS-DOS 1.0 (1981)",d:"Microsoft's original OS for the IBM PC platform; often just called DOS. Supported only 5.25-inch floppy disks storing 320K.",m:2},
{t:"PC DOS",d:"The version of MS-DOS that ran on early IBM computers, customized and marketed by IBM (vs. Microsoft-branded MS-DOS used on PC clones).",m:2},
{t:"MS-DOS 2.0 (1983)",d:"Supported a 10 MB hard disk on the IBM PC-XT and 360K floppies; required a minimum of 28K RAM (up from 14K in MS-DOS 1.0).",m:2},
{t:"MS-DOS 3.1 (1984)",d:"First DOS version to support the network redirector, letting a shared folder be accessed as a drive letter. Also introduced Microsoft Network (MS-Net), which gained little traction against Novell NetWare.",m:2},
{t:"Network redirector",d:"A feature (introduced in MS-DOS 3.1) that allows a network resource, like a shared folder, to be accessed as a drive letter.",m:2},
{t:"MS-DOS 6.22",d:"The last version of MS-DOS released as a separate product; later versions were embedded as the underlying OS for Windows 95, 98, and ME.",m:2},
{t:"Windows (1983/1985)",d:"Announced in 1983, released in 1985. Early Windows was really just a graphical application with mouse support running on top of MS-DOS — not multitasking.",m:2},
{t:"Windows 3.1 (1992)",d:"The first popular, usable Microsoft GUI; still built on MS-DOS and did not support real multitasking, only task-switching.",m:2},
{t:"Task-switching",d:"A process where the system gives control to whichever window/program was just clicked, but only that foreground task gets CPU time — used in Windows 3.1 (not true multitasking).",m:2},
{t:"Windows for Workgroups (WfW) 3.1/3.11 (1993)",d:"Added built-in networking, enhanced network drivers, and a TCP/IP protocol stack. WfW 3.11 ran only in 80386 enhanced mode, making it faster/more reliable.",m:2},
{t:"Windows 95",d:"Introduced the Start Menu/taskbar desktop that became the standard look for all future Windows; a hybrid 16-bit/32-bit OS that eliminated the 640 KB memory limit.",m:2},
{t:"Windows 95's new features",d:"The Windows desktop, Plug and Play, ActiveX/COM, the registry, multitasking & multithreading, and enhanced network/Internet capabilities.",m:2},
{t:"Plug and Play (PnP)",d:"A Windows 95 hardware feature that lets the OS automatically detect and configure newly installed hardware, replacing manual switch/jumper configuration.",m:2},
{t:"ActiveX / Component Object Model (COM)",d:"A Microsoft technology (and its parent standard) providing a standardized way for objects — programs, files, printers, windows — to communicate with each other.",m:2},
{t:"The registry (Windows 95+)",d:"A hierarchical database storing OS configuration, driver info, software/hardware settings, performance info, and desktop configuration — replacing scattered config files.",m:2},
{t:"Task supervisor",d:"A Windows 95 feature that detects processes that appear stuck (hung tasks) and lets you close them without restarting the whole OS.",m:2},
{t:"Hung task",d:"A process/task that no longer responds to keyboard or mouse input.",m:2},
{t:"Multithreading (Windows 95)",d:"Windows 95 was the first Microsoft OS to support multithreading — a CPU executing separate parts of a process at the same time.",m:2},
{t:"Windows 98 — Active Desktop",d:"A Windows 98 feature letting you view desktop items as a Web page; discontinued starting with Windows XP Professional 64-bit Edition.",m:2},
{t:"Windows 98 — USB support",d:"Windows 98 added support for newer hardware standards including Universal Serial Bus (USB) 1.0.",m:2},
{t:"Windows Millennium Edition (Me)",d:"Developed for home users (not office/professional); introduced Universal Plug and Play (UPnP), a set of protocols for auto-discovering/configuring network devices.",m:2},
{t:"Windows NT",d:"\"Windows New Technology,\" first announced 1991 for high-end workstations/servers after Microsoft and IBM ended their OS/2 collaboration. Kernel runs in privileged mode.",m:2},
{t:"ntoskrnl.exe (ntoskernel)",d:"The core kernel file for Windows NT and all Windows OSs starting with Windows 2000. The kernel for Windows 9x/ME was krnl386.exe instead.",m:2},
{t:"Windows NT 3.1",d:"There were no earlier NT versions — NT started life as version 3.1 (announced 1991, released July 1993).",m:2},
{t:"Windows NT 4.0",d:"The first widely successful version of Windows NT, released around the same time as Windows 95, sporting the Windows 95 look.",m:2},
{t:"Windows NT Workstation vs. Windows NT Server",d:"NT Workstation was a stable, secure graphical OS for end users; NT Server was a multiuser server OS for Windows and other OS clients.",m:2},
{t:"Windows NT networking protocols",d:"Supported TCP/IP (Internet standard), NetBEUI (proprietary Windows file sharing), IPX/SPX (Novell NetWare), DLC (IBM mainframes), and AppleTalk (Apple computers).",m:2},
{t:"C2 security rating",d:"Windows NT 4.0 Server received a C2 top-secret U.S. government security rating covering file/folder protection, accounts & passwords, auditing, and access controls.",m:2},
{t:"Domain (Windows NT)",d:"An administrative and security boundary within which all member computers are subject to common administrative and security policies.",m:2},
{t:"Primary domain controller (PDC)",d:"In a Windows NT domain, the one server responsible for keeping all usernames/passwords; other servers requested info from it. Precursor to Active Directory.",m:2},
{t:"Single sign-on",d:"A feature of the Windows NT domain model letting a user sign on once and gain access to any computer that's a member of the domain.",m:2},
{t:"NTFS (New Technology File System)",d:"Introduced in Windows NT; provides file- and folder-level permissions. Still the primary file system on all Windows OSs.",m:2},
{t:"Windows on Windows (WOW) / NTVDM",d:"A Windows NT subsystem that lets 16-bit applications run preemptively multitasked in a virtual DOS environment (NT Virtual DOS Machine), reducing freezes.",m:2},
{t:"Windows 2000",d:"Built on Windows NT technology; kernel rewrite ran ~30% faster, added VPN support, driver signing, and introduced Active Directory.",m:2},
{t:"Virtual private network (VPN)",d:"A private network providing authentication and encryption while running over a non-secure network like the Internet, introduced with Windows 2000.",m:2},
{t:"Driver signing",d:"A Windows 2000 feature ensuring device drivers can't be inadvertently overwritten by earlier versions and only certified drivers can be installed.",m:2},
{t:"Active Directory",d:"Introduced in Windows 2000 Server; the core service/database of a Windows domain, providing single-point user authentication/authorization and resource management via organizational units.",m:2},
{t:"Organizational units",d:"Folders within Active Directory used to organize resources hierarchically, much like a file system organizes files in folders/subfolders.",m:2},
{t:"Domain controller (DC) — Windows 2000 change",d:"Unlike NT's single read/write PDC + read-only BDCs, every Windows 2000 DC could create and change Active Directory info; DCs synchronize via replication.",m:2},
{t:"Backup domain controller (BDC)",d:"In Windows NT Server 4.0, a server holding a read-only copy of account/security info as a backup to the PDC.",m:2},
{t:"Replication",d:"The process by which domain controllers periodically synchronize Active Directory information with each other.",m:2},
{t:"Kerberos",d:"A security system/authentication protocol (added in Windows 2000) providing mutual authentication between client and server using encrypted tickets instead of sending passwords across the network.",m:2},
{t:"IntelliMirror",d:"A Windows 2000 concept enabling clients to access the same desktop settings/apps/files anywhere; enabled roaming profiles, folder redirection, and offline files.",m:2},
{t:"Windows 2000 editions",d:"Server, Advanced Server, and Datacenter Server, differing mainly in CPU/memory support; Advanced/Datacenter also supported server clustering.",m:2},
{t:"Windows XP & Windows Server 2003",d:"The two products Windows 2000 evolved into, both built on the Windows 2000 kernel; XP was the desktop version, Server 2003 the server version.",m:2},
{t:"Activation",d:"A mechanism to prevent software piracy, first required by Windows XP; the OS could be activated online or by phone, with the code linked to a specific computer.",m:2},
{t:"Windows XP Professional",d:"Intended for office/professional use; supported multiple user accounts and could act as a small server for up to 10 users, like Windows 2000 Professional.",m:2},
{t:"Windows Server 2003/R2 new features",d:"XP-style GUI, faster Active Directory logon, hundreds of new group policies, 64-bit Itanium support, Remote Desktop management, Terminal Services, and .NET runtime.",m:2},
{t:"Distributed File System (DFS)",d:"A valuable Windows Server 2003 R2 feature (along with clustered servers and group policies) for managing files across an enterprise network.",m:2},
{t:"Windows 7",d:"Released after Windows Vista; known for simply \"working,\" with faster performance (~1/3 faster than XP/2000), enhanced search, and the Aero desktop presentation.",m:2},
{t:"Windows Vista",d:"The version between XP and 7; poorly received due to early reliability/driver problems, quickly followed by Windows 7 to mitigate reputation damage.",m:2},
{t:"Aero",d:"Windows 7's \"unified presentation subsystem\" desktop (Authentic, Energetic, Reflective, Open) offering consistent window design and 3D \"Glass\" visual effects.",m:2},
{t:"User Account Protection (UAP) / UAC",d:"Introduced in Windows Vista; warns users when apps/tools are about to change critical system settings, limiting the risk of running everything as administrator.",m:2},
{t:"Windows Service Hardening (WSH)",d:"A Windows 7 feature that restricts a service (like FTP) from performing activities in critical OS structures, limiting damage if that service is compromised.",m:2},
{t:"Connection security rules / IPsec",d:"Group policy rules ensuring communication sessions between clients/servers are authenticated and encrypted using the IP Security (IPsec) protocol suite.",m:2},
{t:"Windows Server 2008 new features",d:"Read-only domain controller, failover & load-balancing clusters, Hyper-V, self-healing NTFS, Server Core, PowerShell, and Server Manager.",m:2},
{t:"Read-only domain controller (RODC)",d:"A domain controller (Windows Server 2008) where domain changes can't be initiated locally — changes are written elsewhere and replicated to it. Good for low-security branch offices.",m:2},
{t:"Failover cluster",d:"Two or more tightly linked servers where one is active and others are standby; if the active server fails, a standby takes over providing services.",m:2},
{t:"Network load-balancing (NLB) cluster",d:"A server configuration where servers share the load of incoming requests for scalability and fault tolerance; best for TCP/IP apps like Web servers, not database/file/print apps.",m:2},
{t:"Hyper-V",d:"Microsoft's hypervisor service (introduced Windows Server 2008) allowing Windows Server to host multiple isolated virtual machines on one physical server.",m:2},
{t:"Self-healing NTFS",d:"A Windows Server 2008 feature where Chkdsk-style repairs run in the background rather than requiring the whole volume to go offline.",m:2},
{t:"Server Core",d:"A bare-bones Windows Server installation with a limited GUI, managed via command prompt/PowerShell, reducing the attack surface. Default install option since Server 2016/2019.",m:2},
{t:"PowerShell",d:"A powerful command-line interface and scripting language (standard since Windows Server 2008) using verb-noun \"cmdlets\" like Get-Help or Set-User.",m:2},
{t:"Server Manager",d:"A tool that combines/replaces older wizards, centralizing server setup, deployment, role management, and status checks in one location.",m:2},
{t:"Windows 8/8.1",d:"Released Oct 2012 (8.1 in Oct 2013); intended to unify UI/code base across touch and desktop devices. The touch-centric interface (and missing Start button) was poorly received.",m:2},
{t:"Storage Spaces",d:"A Windows 8 storage management tool letting users/admins pool disks of different sizes/interfaces into a single storage pool, creating virtual disks/volumes.",m:2},
{t:"Client Hyper-V",d:"Brought Hyper-V virtualization to Windows client OSs starting with Windows 8, letting you run older Windows versions in a VM alongside the host OS.",m:2},
{t:"Windows Server 2012",d:"Microsoft's deep dive into the private cloud; editions are Standard, Datacenter, Essentials (25 users or fewer), and Foundation (OEM-only, 15 users).",m:2},
{t:"Minimal Server Interface (MinShell)",d:"A happy medium between Server Core and the full GUI, letting users perform most local management tasks with a GUI tool but lacking the full interface.",m:2},
{t:"Resilient File System (ReFS)",d:"A file system introduced in Windows Server 2012 for large, highly reliable data storage; backward-compatible with NTFS but lacks features like file compression, disk quotas, and EFS.",m:2},
{t:"Dynamic Access Control (DAC)",d:"Gives fine-tuned control over shared resources based on user attributes/file classification rather than only group-based permissions.",m:2},
{t:"Windows 10",d:"Released July 2015 (jumping from 8.1, skipping \"9\"); may be the last numbered Windows release, with regular feature updates (e.g., v1507, v1903) instead of new version names.",m:2},
{t:"Virtual desktops (Windows 10)",d:"Let users create multiple desktops and switch between them to organize open application windows — a feature long available on Linux desktop managers.",m:2},
{t:"Cortana",d:"Windows 10's digital assistant (like Siri/Google Assistant), requiring a Microsoft account; accessed via the search bar, used for voice commands, reminders, and questions.",m:2},
{t:"Windows Hello",d:"A Windows 10 sign-in feature letting you use facial recognition or a fingerprint (with compatible hardware) instead of just a password or PIN.",m:2},
{t:"Windows Sandbox",d:"First available in Windows 10 v1903; a temporary, isolated desktop environment for running untrusted/experimental apps without affecting the host OS. Needs 4 GB RAM & 2 cores.",m:2},
{t:"Windows Server 2016",d:"Comes with the Windows 10 UI; introduced Nano Server and expanded virtualization with Windows Server Containers and Hyper-V Containers.",m:2},
{t:"Nano Server",d:"A Windows Server 2016 install option even smaller than Server Core, with no local logon (remote management only); can only run in a Windows container starting with version 1709.",m:2},
{t:"Windows Containers",d:"Server 2016's two container options: Windows Server Containers (moderate isolation, shared kernel) and Hyper-V Containers (VM-level isolation without full VM overhead).",m:2},
{t:"Windows Server 2019",d:"Focuses on hybrid cloud datacenters, security, and hyper-converged infrastructure (HCI); introduced Windows Admin Center and deeper Linux integration (WSL, encrypted Linux VMs).",m:2},
{t:"Windows Admin Center (WAC)",d:"A browser-based management console (introduced in Server 2019) for managing servers, clusters, Windows 10 clients, and HCI, with tight Azure integration.",m:2},
{t:"Hyper-converged infrastructure (HCI)",d:"A computing model where virtualization extends beyond VMs to virtual storage networks and virtualized networking, all software-defined rather than hardware-defined.",m:2},
{t:"Windows Defender ATP",d:"Windows Defender Advanced Threat Protection; adds Exploit Guard, an intrusion prevention feature that can lock down a server under attack and alert an administrator.",m:2},
{t:"UNIX",d:"The oldest, most diverse, and most complex OS covered — no single company holds an exclusive license, so many diverse \"flavors\" with diverse utilities exist.",m:2},
{t:"BSD vs. SVR4",d:"The two main UNIX design standards: Berkeley Software Distribution (e.g., FreeBSD, NetBSD, macOS/Darwin) and System V Release 4 (e.g., many Linux distros, Solaris).",m:2},
{t:"Linux",d:"\"UNIX-like\" OS based on standards developed after UNIX; runs on Intel/AMD, ARM, and RISC-V processors and is at the heart of many embedded/real-time systems.",m:2},
{t:"Linux shells",d:"The user interface for Linux; most popular are the Bourne shell (sh), Bourne Again shell (bash), and C shell (csh, formatted similar to the C language).",m:2},
{t:"External commands (Linux)",d:"OS or application programs stored as a separate executable file on disk, called by typing the command name at the shell prompt.",m:2},
{t:"X Window (X11)",d:"Provides basic window management for most Linux GUIs; network-enabled, meaning an X terminal can run X Window and its apps remotely on another Linux computer.",m:2},
{t:"GNOME / KDE",d:"Popular Linux desktop managers that run on top of X Window to provide a rich desktop user interface.",m:2},
{t:"Linux terminal window",d:"The Linux GUI's equivalent of a Windows command prompt window, used to access a shell.",m:2},
{t:"Linux networking",d:"Based on the BSD networking model, providing TCP/IP support; Linux is the most common OS for Web servers, mail servers, and many Internet-based applications.",m:2},
{t:"macOS",d:"Built on Darwin, an open-source UNIX-like OS Apple released in 2000; the Mac's all-graphical UI/shell is said to have influenced Windows' look and feel.",m:2},
{t:"Darwin",d:"The open-source, UNIX-like OS (released by Apple in 2000) that macOS is built on.",m:2},
{t:"MultiFinder",d:"A program that gave pre-8.0 Mac OS versions task-switching (not true multitasking); Mac OS 8.0+ made multitasking standard for all applications.",m:2},
{t:"AppleTalk",d:"An older Mac peer-to-peer networking protocol, remaining compatible through Mac OS X Leopard (10.5); no longer supported starting with Mac OS X 10.6 (Snow Leopard).",m:2},
{t:"Mac OS X (\"Aqua\" interface)",d:"Mac OS X (version 10) sported the Aqua interface, the basis for all successive Mac OS X/macOS releases; replaced/removed customization of the old Apple menu.",m:2},
{t:"System Preferences",d:"Mac OS X's tool (similar to Windows Control Panel) for setting time/date, display, startup, energy-saving, and network functions.",m:2},
{t:"Dock",d:"A customizable macOS feature for starting multiple applications and switching between them in a multitasking environment.",m:2},
{t:"Mac OS X 10.6 Snow Leopard",d:"The first version of Mac OS X to support only Intel-based processors; a Rosetta download retained support for older PowerPC applications.",m:2},
{t:"Mac OS X 10.7 Lion",d:"Incorporated popular iOS features like Launchpad (browse installed apps) and expanded multi-touch gestures; introduced Mission Control.",m:2},
{t:"Mac OS X 10.8 Mountain Lion",d:"Added support for iMessage, iWork, iCloud, and Notification Center; all software updates moved exclusively to the App Store.",m:2},
{t:"Mac OS X 10.9 Mavericks",d:"Ran on Intel 64-bit processors; first release named after a California location instead of a big cat, adding Maps and iBooks.",m:2},
{t:"Mac OS X 10.10 Yosemite",d:"Gave Mac OS X a flat, iOS 7-based facelift; introduced Handoff, letting you continue work in progress between an iOS device and your Mac.",m:2},
{t:"Mac OS X 10.11 El Capitan",d:"Added Split View (two apps snapped to opposite sides of the screen), updated Spotlight, Pinned Sites, and Metal — a set of 3D development tools.",m:2},
{t:"macOS 10.12 Sierra",d:"Introduced Siri (voice assistant) to the Mac and Optimized Storage, which removes locally-saved iCloud files when storage runs low.",m:2},
{t:"macOS 10.14 Mojave",d:"Added Dark Mode, Dynamic Desktop (changes color scheme through the day), Marzipan (runs select iOS apps on Mac), and Desktop Stacks (auto-groups desktop icons).",m:2},

// ---- MODULE 3: THE CPU ----
{t:"System architecture",d:"Includes the number/type of CPUs in the hardware, the communication routes (buses) between them, and other hardware like memory and disk storage.",m:3},
{t:"Bus",d:"A path or channel between a computer's CPU and the devices it manages, such as memory and I/O devices.",m:3},
{t:"Single-processor computer",d:"A computer with just one physical CPU chip (most client computers).",m:3},
{t:"Processor core",d:"The part of a CPU that reads and executes machine code, such as reading/writing data or performing arithmetic.",m:3},
{t:"Multicore processor",d:"A CPU chip with two or more cores (e.g., dual-core = 2 cores, quad-core = 4 cores).",m:3},
{t:"Die",d:"The result of manufacturing a CPU on a silicon wafer — holds all the logic making up the CPU.",m:3},
{t:"Multiprocessor computer",d:"A computer (often a server) with multiple separate physical CPUs, ranging from two to 128 or more.",m:3},
{t:"Reset vector",d:"A memory address a CPU begins reading from whenever it receives a reset signal (e.g., power-on); points to non-volatile memory holding bootloader code.",m:3},
{t:"Program counter",d:"A register on a CPU that contains the address of the next instruction the CPU will execute.",m:3},
{t:"Control unit (CU)",d:"The \"director of operations\" in the CPU — provides timing and coordination between the ALU, registers, and system bus.",m:3},
{t:"Arithmetic logic unit (ALU)",d:"Performs the primary task of a CPU — executing arithmetic (add, multiply) and logic (AND, OR) instructions.",m:3},
{t:"Floating-point unit (FPU)",d:"A component found in most CPUs that performs floating-point (decimal) operations.",m:3},
{t:"Register",d:"A temporary holding location on a CPU where data must be placed before the CPU can use it.",m:3},
{t:"Memory/cache controller",d:"Intercepts memory accesses and checks cache first; if not found there, passes the request to main memory.",m:3},
{t:"System bus (3 types)",d:"Made up of the control bus, address bus, and data bus, used to communicate between the CPU and RAM/I-O devices.",m:3},
{t:"Control bus",d:"Carries status signals — like interrupt signals — between the CPU and other devices.",m:3},
{t:"Address bus",d:"Carries address signals indicating where data should be read from or written to in memory.",m:3},
{t:"Data bus",d:"Carries the actual data being read from or written to system memory.",m:3},
{t:"CISC (Complex Instruction Set Computing)",d:"CPU architecture with complex instructions that do a lot of work each (may take several clock cycles); uses microcode.",m:3},
{t:"RISC (Reduced Instruction Set Computing)",d:"CPU architecture with simple instructions that each typically take one clock cycle; no microcode, more registers, easier pipelining.",m:3},
{t:"Instruction set",d:"The list of machine code commands that a CPU supports.",m:3},
{t:"Pipelining",d:"The ability of a CPU to perform more than one task on a single clock cycle — easier and more effective on RISC CPUs.",m:3},
{t:"Microcode",d:"A small program inside a CISC chip that interprets and executes each complex instruction; RISC CPUs don't use it.",m:3},
{t:"Compiler",d:"A program that takes a high-level language (like C++ or Java) and turns it into assembly code.",m:3},
{t:"Assembler",d:"Turns human-readable assembly code instructions into numeric opcodes the CPU can understand.",m:3},
{t:"Opcode",d:"The numeric code read by the CPU that represents a particular machine instruction.",m:3},
{t:"Internal clock speed",d:"The speed at which a CPU executes an instruction (or part of one) internally; can range from under 1 MHz to over 5 GHz.",m:3},
{t:"External clock speed",d:"The (usually lower) speed a CPU uses to communicate with the rest of the computer — often 1/2, 1/3, 1/4, or 1/8 the internal clock speed.",m:3},
{t:"Cache memory",d:"Extremely fast memory built into the CPU chip that holds data/instructions likely to be needed next, avoiding slow waits on RAM.",m:3},
{t:"Level 1 (L1) cache",d:"The fastest but smallest cache (typically 8–128 KB per core); runs at CPU speed and is always part of the CPU chip.",m:3},
{t:"Level 2 (L2) cache",d:"Somewhat slower than L1 but larger (often 256 KB–1 MB per core); also an integral part of the CPU chip.",m:3},
{t:"Level 3 (L3) cache",d:"Shared among CPU cores; on modern CPUs is part of the chip; found in sizes of 8 MB, 16 MB, and greater.",m:3},
{t:"Level 4 (L4) cache",d:"If present, usually found on the motherboard; some high-end CPUs now include on-board L4 cache up to 128 MB.",m:3},
{t:"Cache controller",d:"Specialized hardware that predicts what data will be needed and makes it available in cache before it's needed.",m:3},
{t:"16-bit address bus",d:"Can address 64 KB (65,536 bytes) of memory.",m:3},
{t:"32-bit address bus",d:"Can address roughly 4 GB (4 billion bytes) of memory.",m:3},
{t:"64-bit address bus",d:"Used by modern processors; allows addressing up to 16 TB of memory.",m:3},
{t:"CPU scheduling",d:"Determines which process executes when multiple processes are waiting to run — a function of the OS, not the CPU hardware itself.",m:3},
{t:"Thread",d:"The smallest block of computer code that can be independently scheduled for execution.",m:3},
{t:"Multithreading",d:"The ability of an OS to run two or more threads of a process at the same time.",m:3},
{t:"Hyper-threading (HT)",d:"An Intel feature allowing two threads to run on each CPU core simultaneously (a 4-core HT CPU shows as 8 logical processors).",m:3},
{t:"x86",d:"Notation indicating compatibility with the Intel 8086 processor architecture used in modern Intel/AMD CPUs.",m:3},
{t:"Intel 8086",d:"The CPU architecture found in early PCs; introduced in 1978, originally ran at 16 MHz with a 16-bit data bus.",m:3},
{t:"Intel 8088",d:"Used in the original IBM PC; almost identical to the 8086 except its data bus was only 8 bits wide (chosen for lower cost).",m:3},
{t:"Overclocking",d:"Running a processor faster than its stated/rated clock speed (e.g., running a 3 GHz CPU at 3.3 GHz).",m:3},
{t:"AMD",d:"Advanced Micro Devices — makes CISC processors compatible with Intel x86-based software; tends to cost less and overclock more easily.",m:3},
{t:"ARM (Advanced RISC Machines) processor",d:"RISC processors common in mobile devices, embedded systems, and increasingly servers; the most common processor architecture in the world.",m:3},
{t:"Microarchitecture",d:"The description of a CPU's internal circuitry — defines the chip-making technology, supported instruction set, and bit size.",m:3},
{t:"GT/s (gigatransfers per second)",d:"The unit often used to describe the bus speed of modern multicore CPUs.",m:3},
{t:"Intel Core i5 (Table 3-2)",d:"Introduced 2009; 2–4 cores; 1.06–3.76 GHz; 2.5 GT/s bus; 3–8 MB L3 cache. AMD comparable: Ryzen 5.",m:3},
{t:"Intel Core i7 (Table 3-2)",d:"Introduced 2008; 2–6 cores; 1.06–3.33 GHz; 2.5–4.8 GT/s bus; 4–15 MB L3 cache. AMD comparable: Ryzen 7.",m:3},
{t:"Intel Core i3 (Table 3-2)",d:"Introduced 2010; 2 cores; 1.20–3.06 GHz; 2.5 GT/s bus; 3–4 MB L3 cache. AMD comparable: Ryzen 3.",m:3},
{t:"Intel Core i9 (Table 3-2)",d:"Introduced 2017; 10–18 cores; 2.6–4 GHz; 8 GT/s bus; 13–25 MB L3 cache. AMD comparable: Ryzen 9.",m:3},
{t:"Haswell microarchitecture",d:"An Intel microarchitecture released in 2013 (example: the Intel Core i7-5820 Haswell-E, a six-core CPU at 3.3 GHz).",m:3},
{t:"Cascade Lake-AP",d:"The most current Intel microarchitecture mentioned (released 2019) for the Xeon server line — up to 56 cores at 2.6 GHz with up to 77 MB L3 cache.",m:3},
{t:"lscpu (Linux command)",d:"Displays a summary of the CPU's architecture in Linux.",m:3},
{t:"/proc/cpuinfo",d:"A Linux file (viewed with commands like \"less /proc/cpuinfo\") containing detailed information about each processor/core.",m:3},
{t:"top (Linux command)",d:"An interactive, real-time task manager in a terminal window; shows top CPU-using processes and can toggle to thread view.",m:3},
{t:"pstree (Linux command)",d:"Shows a snapshot of the hierarchy (tree) of running processes in Linux.",m:3},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function filterByMod(list, f){
  if(f==="all") return list.slice();
  return list.filter(x=>String(x.m)===String(f));
}

          <li>Windows NT, 2000, XP, Server 2003</li>
          <li>Windows 7/8/10 &amp; Server 2008&ndash;2019</li>
          <li>Active Directory, domains &amp; Kerberos</li>
          <li>Hyper-V, containers, clustering, HCI</li>
          <li>UNIX/Linux shells, X Window, GNOME/KDE</li>
          <li>macOS/Darwin history &amp; key releases</li>
          <li>CPU architecture: CU, ALU, registers, buses</li>
          <li>CISC vs. RISC, pipelining, microcode</li>
          <li>Clock speed, cache levels L1&ndash;L4</li>
          <li>Threads, multithreading, hyper-threading</li>
          <li>Intel, AMD &amp; ARM processors</li>
          <li>Address/data/control bus math</li>
        </ul>
      </div>
    </div>

    <footer class="note">Source: Module 1 &mdash; Operating Systems Fundamentals &middot; Module 2 &mdash; Modern Client and Server Operating Systems &middot; Module 3 &mdash; The Central Processing Unit (CPU). Built for review only.</footer>
  `;
  document.getElementById("goFlash").onclick = ()=>{ startFlash("all"); };
  document.getElementById("goQuiz").onclick = ()=>{ startQuiz("all"); };
  document.getElementById("brandHome").onclick = ()=>{};
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
function startFlash(filter){
  fsFilter = filter;
  fsDeck = shuffle(filterByMod(FLASHCARDS, filter));
  fsIndex = 0;
  fsFlipped = false;
  view = "flash";
  renderFlash();
}

function renderFlash(){
  const el = document.getElementById("app");
  const card = fsDeck[fsIndex];
  const modLabel = card.m===1 ? "MODULE 1 &middot; OS FUNDAMENTALS" : (card.m===2 ? "MODULE 2 &middot; CLIENT/SERVER OSs" : "MODULE 3 &middot; THE CPU");
  const modClass = card.m===1 ? "" : (card.m===2 ? "violet" : "teal");

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
      <div class="scorepill mono">Flashcards</div>
    </div>

    <div class="filterrow">
      <button class="fbtn ${fsFilter==='all'?'active':''}" data-f="all">All (${FLASHCARDS.length})</button>
      <button class="fbtn ${fsFilter==='1'?'active':''}" data-f="1">Module 1 &middot; OS (${FLASHCARDS.filter(c=>c.m===1).length})</button>
      <button class="fbtn violet ${fsFilter==='2'?'active':''}" data-f="2">Module 2 &middot; Client/Server (${FLASHCARDS.filter(c=>c.m===2).length})</button>
      <button class="fbtn teal ${fsFilter==='3'?'active':''}" data-f="3">Module 3 &middot; CPU (${FLASHCARDS.filter(c=>c.m===3).length})</button>
    </div>

    <div class="progwrap">
      <div class="progtext"><span>Card <b>${fsIndex+1}</b> of ${fsDeck.length}</span><span>Tap card to flip</span></div>
      <div class="progbar"><div class="progfill" style="width:${((fsIndex+1)/fsDeck.length)*100}%"></div></div>
    </div>

    <div class="cardstage">
      <div class="flashcard ${fsFlipped?'flipped':''}" id="flashcardEl">
        <div class="face front">
          <div class="modlabel ${modClass}">${modLabel}</div>
          <div class="termtext">${escapeHtml(card.t)}</div>
          <div class="hint">tap to reveal definition</div>
        </div>
        <div class="face back ${modClass}">
          <div class="modlabel ${modClass}">DEFINITION</div>
          <div class="deftext">${escapeHtml(card.d)}</div>
          <div class="hint">tap to flip back</div>
        </div>
      </div>
    </div>

    <div class="cardnav">
      <div class="navbtns">
        <button class="navbtn" id="prevBtn" ${fsIndex===0?'disabled':''}>&larr; Prev</button>
        <button class="navbtn primary" id="nextBtn">${fsIndex===fsDeck.length-1?'Restart deck':'Next &rarr;'}</button>
      </div>
      <button class="iconbtn" id="shuffleBtn" title="Shuffle">&#8635;</button>
    </div>
  `;

  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  document.getElementById("flashcardEl").onclick = ()=>{ fsFlipped=!fsFlipped; document.getElementById("flashcardEl").classList.toggle("flipped"); };
  document.getElementById("prevBtn").onclick = ()=>{ if(fsIndex>0){ fsIndex--; fsFlipped=false; renderFlash(); } };
  document.getElementById("nextBtn").onclick = ()=>{
    if(fsIndex<fsDeck.length-1){ fsIndex++; } else { fsIndex=0; }
    fsFlipped=false; renderFlash();
  };
  document.getElementById("shuffleBtn").onclick = ()=>{ fsDeck = shuffle(fsDeck); fsIndex=0; fsFlipped=false; renderFlash(); };
  el.querySelectorAll(".filterrow .fbtn").forEach(b=>{
    b.onclick = ()=>{ startFlash(b.dataset.f); };
  });
}

/* =========================================================
   QUIZ
   ========================================================= */
function startQuiz(filter){
  qzFilter = filter;
  qzDeck = shuffle(filterByMod(QUIZ, filter));
  qzIndex = 0;
  qzScore = 0;
  qzAnswered = false;
  qzWrongList = [];
  view = "quiz";
  renderQuiz();
}

function renderQuiz(){
  const el = document.getElementById("app");
  const item = qzDeck[qzIndex];
  const modLabel = item.m===1 ? "MODULE 1 &middot; OS FUNDAMENTALS" : (item.m===2 ? "MODULE 2 &middot; CLIENT/SERVER OSs" : "MODULE 3 &middot; THE CPU");
  const modClass = item.m===1 ? "" : (item.m===2 ? "violet" : "teal");
  const letters = ["A","B","C","D"];

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
      <div class="scorepill mono">Score <b>${qzScore}</b> / ${qzIndex + (qzAnswered?1:0)}</div>
    </div>

    <div class="filterrow" id="filterRow">
      <button class="fbtn ${qzFilter==='all'?'active':''}" data-f="all">All (${QUIZ.length})</button>
      <button class="fbtn ${qzFilter==='1'?'active':''}" data-f="1">Module 1 &middot; OS (${QUIZ.filter(c=>c.m===1).length})</button>
      <button class="fbtn violet ${qzFilter==='2'?'active':''}" data-f="2">Module 2 &middot; Client/Server (${QUIZ.filter(c=>c.m===2).length})</button>
      <button class="fbtn teal ${qzFilter==='3'?'active':''}" data-f="3">Module 3 &middot; CPU (${QUIZ.filter(c=>c.m===3).length})</button>
    </div>

    <div class="progwrap">
      <div class="progtext"><span>Question <b>${qzIndex+1}</b> of ${qzDeck.length}</span><span>${Math.round(((qzIndex)/qzDeck.length)*100)}% through</span></div>
      <div class="progbar"><div class="progfill" style="width:${(qzIndex/qzDeck.length)*100}%"></div></div>
    </div>

    <div class="qcard">
      <div class="qmod ${modClass}">${modLabel}</div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="options" id="optionsWrap">
        ${item.o.map((opt,i)=>`
          <button class="opt" data-i="${i}">
            <span class="letter mono">${letters[i]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedbackBox"></div>
    </div>

    <div class="quizfoot">
      <button class="navbtn primary hidden" id="nextQBtn">${qzIndex===qzDeck.length-1 ? 'See results' : 'Next question'} &rarr;</button>
    </div>
  `;

  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  el.querySelectorAll("#filterRow .fbtn").forEach(b=>{
    b.onclick = ()=>{ startQuiz(b.dataset.f); };
  });

  const optButtons = el.querySelectorAll(".opt");
  optButtons.forEach(btn=>{
    btn.onclick = ()=>{
      if(qzAnswered) return;
      qzAnswered = true;
      const chosen = parseInt(btn.dataset.i,10);
      const correct = item.a;
      const isRight = chosen === correct;
      if(isRight) qzScore++;
      else qzWrongList.push(item);

      optButtons.forEach(b=>{
        const i = parseInt(b.dataset.i,10);
        b.disabled = true;
        if(i===correct) b.classList.add("correct");
        else if(i===chosen) b.classList.add("wrong");
        else b.classList.add("dim");
      });

      const fb = document.getElementById("feedbackBox");
      fb.classList.add("show");
      if(isRight){
        fb.classList.add("good");
        fb.innerHTML = "<b>Correct.</b> " + escapeHtml(item.o[correct]) + " is right.";
      } else {
        fb.classList.add("bad");
        fb.innerHTML = "<b>Not quite.</b> The correct answer is: <b>" + escapeHtml(item.o[correct]) + "</b>";
      }

      document.getElementById("nextQBtn").classList.remove("hidden");
      // update score pill live
      document.querySelector(".scorepill").innerHTML = "Score <b>"+qzScore+"</b> / "+(qzIndex+1);
    };
  });

  document.getElementById("nextQBtn").onclick = ()=>{
    if(qzIndex < qzDeck.length-1){
      qzIndex++;
      qzAnswered = false;
      renderQuiz();
    } else {
      view = "results";
      renderResults();
    }
  };
}

function renderResults(){
  const el = document.getElementById("app");
  const total = qzDeck.length;
  const pct = Math.round((qzScore/total)*100);
  let msg = "Solid — a bit more repetition and you've got it.";
  if(pct>=90) msg = "That's exam-ready. Nice work.";
  else if(pct>=75) msg = "Good grasp overall — review the misses below.";
  else if(pct<50) msg = "Worth another full pass through the flashcards first.";

  el.innerHTML = `
    <div class="viewhead">
      <button class="back" id="backHome">&larr; Home</button>
      <div class="scorepill mono">Quiz complete</div>
    </div>
    <div class="qcard results">
      <div class="big mono">${qzScore}/${total}</div>
      <p>${pct}% correct &mdash; ${msg}</p>
      <div class="navbtns" style="justify-content:center; display:flex;">
        <button class="navbtn primary" id="retryBtn">Retry this set</button>
        <button class="navbtn" id="retryWrongBtn" ${qzWrongList.length===0?'disabled':''}>Review ${qzWrongList.length} missed</button>
      </div>
    </div>
    ${qzWrongList.length>0 ? `
    <div class="coverage" style="margin-top:26px;">
      <h4>Questions you missed</h4>
      <ul style="columns:1;">
        ${qzWrongList.map(w=>`<li>${escapeHtml(w.q)} &mdash; <b>${escapeHtml(w.o[w.a])}</b></li>`).join("")}
      </ul>
    </div>` : ""}
  `;
  document.getElementById("backHome").onclick = ()=>{ view="home"; renderHome(); };
  document.getElementById("retryBtn").onclick = ()=>{ startQuiz(qzFilter); };
  if(qzWrongList.length>0){
    document.getElementById("retryWrongBtn").onclick = ()=>{
      qzDeck = shuffle(qzWrongList);
      qzIndex = 0; qzScore = 0; qzAnswered = false; qzWrongList = [];
      view = "quiz";
      renderQuiz();
    };
  }
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

/* boot */
renderHome();
</script>
</body>
</html>
